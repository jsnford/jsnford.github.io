<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Little Places Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Marcellus+SC&family=Barlow+Semi+Condensed:wght@500&family=Pinyon+Script&family=Caveat+Brush&family=Cormorant+Garamond:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=UnifrakturMaguntia&display=swap">
<style>
  /* A street of Little Places venues as one soft-3D diorama. Works as a web page and inside
     the app's WebView. URL params:
       ?place=all|renegade|jumbi|mae|hausu|tamil|camberwell|halfcut|donia|holycarrot|titas|toms  ?mode=day|night  ?view=iso|top|street  ?spin=1
       ?ui=0 (hide controls)  ?bg=transparent  ?ao=0 (no ambient occlusion)  ?awnings=up (Tamil Prince awnings rolled in) */
  :root {
    --cream: #f7f2ec;
    --ink: #2a2420;
    --muted: #8a7d70;
    --pill: rgba(255, 252, 247, 0.8);
    --pill-ink: #2a2420;
    --pill-on: #2a2420;
    --pill-on-ink: #f8f3ea;
    --line: rgba(42, 36, 32, 0.10);
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 120% 90% at 50% 42%, #f8f4ee 0%, #f2ece3 55%, #e3d9cc 100%) fixed var(--cream);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body.bg-transparent { background: transparent; }
  body.night { --ink: #efe6d9; --muted: #b3a89c; --pill: rgba(34, 36, 54, 0.72); --pill-ink: #efe6d9; --pill-on: #efe6d9; --pill-on-ink: #22243a; --line: rgba(239, 230, 217, 0.14); }

  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage.turning, #stage.turning:active { cursor: move; }
  canvas { display: block; transform: translateZ(0); -webkit-transform: translateZ(0); backface-visibility: hidden; }

  .label {
    position: fixed;
    top: calc(18px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    right: 16px;
    pointer-events: none;
  }
  .label h1 { margin: 0; font: 500 22px/1.1 var(--serif); letter-spacing: -0.01em; }
  .label p { margin: 4px 0 0; font: italic 500 14px/1.3 var(--serif); color: var(--muted); }
  .hint { margin-top: 10px; font: italic 13px/1.4 var(--serif); color: var(--muted); transition: opacity 1s; }

  .bar {
    position: fixed; left: 0; right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    padding: 0 16px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    pointer-events: none;
  }
  .seg {
    pointer-events: auto;
    display: inline-flex; padding: 3px; gap: 2px;
    background: var(--pill);
    border: 1px solid var(--line);
    border-radius: 999px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 6px 20px rgba(40, 30, 20, 0.08);
  }
  .seg button {
    appearance: none; border: 0; margin: 0; cursor: pointer;
    font: 500 14px/1 var(--serif);
    color: var(--pill-ink); background: transparent;
    padding: 9px 13px; border-radius: 999px;
    min-height: 36px;
    transition: background-color .25s, color .25s;
  }
  .seg button[aria-pressed="true"] { background: var(--pill-on); color: var(--pill-on-ink); }
  .seg button { white-space: nowrap; }
  .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  @media (max-width: 420px) { .seg button { padding: 9px 10px; font-size: 13px; } }
  .seg button:focus-visible { outline: 2px solid var(--pill-ink); outline-offset: 1px; }
  body.no-ui .label, body.no-ui .bar { display: none; }

  .loading { position: fixed; inset: 0; background: var(--cream); transition: opacity .6s; pointer-events: none; }
  body.bg-transparent .loading { background: transparent; }
  .loading.done { opacity: 0; }
</style>

<div id="stage"></div>

<div class="label">
  <h1 id="title">Little Places</h1>
  <p id="subtitle">A street of our favourite corners</p>
  <div class="hint" id="hint">Drag to move around · hold space and drag to turn · tap a building</div>
</div>

<div class="bar" role="toolbar" aria-label="View controls">
  <div class="seg" role="group" aria-label="Place">
    <button data-place="all" aria-pressed="true">Street</button>
    <button data-place="renegade" aria-pressed="false">Renegade</button>
    <button data-place="jumbi" aria-pressed="false">Jumbi</button>
    <button data-place="mae" aria-pressed="false">Mae + Harvey</button>
    <button data-place="hausu" aria-pressed="false">Hausu</button>
    <button data-place="tamil" aria-pressed="false">Tamil Prince</button>
    <button data-place="camberwell" aria-pressed="false">Camberwell Arms</button>
    <button data-place="halfcut" aria-pressed="false">Half Cut</button>
    <button data-place="donia" aria-pressed="false">Donia</button>
    <button data-place="holycarrot" aria-pressed="false">Holy Carrot</button>
    <button data-place="titas" aria-pressed="false">Tita's</button>
    <button data-place="toms" aria-pressed="false">Tom's Pasta</button>
  </div>
  <div class="seg" role="group" aria-label="Lighting">
    <button data-mode="day" aria-pressed="true">Day</button>
    <button data-mode="night" aria-pressed="false">Night</button>
  </div>
  <div class="seg" role="group" aria-label="Camera">
    <button data-view="iso" aria-pressed="true">Corner</button>
    <button data-view="top" aria-pressed="false">Above</button>
    <button data-view="street" aria-pressed="false">Street</button>
    <button data-view="inside" aria-pressed="false" id="insideBtn" hidden>Inside</button>
    <button data-spin aria-pressed="false">Spin</button>
  </div>
</div>

<div class="loading" id="loading"></div>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
</script>
<script type="module">

window.__lpError = null;
window.addEventListener('error', e => { window.__lpError = window.__lpError || (e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
import * as THREE from 'three';

// ── Options ────────────────────────────────────────────────────────────────────

  place: ['all', 'renegade', 'jumbi', 'mae', 'hausu', 'tamil', 'camberwell', 'halfcut', 'donia', 'holycarrot', 'titas', 'toms'].includes(params.get('place')) ? params.get('place') : (params.get('build') === '1' ? 'donia' : 'all'),

  // "Build-in intro" block.

// ── Palette ────────────────────────────────────────────────────────────────────
const C = {
  // Warm stock brick and navy trim (from the original 9 Morgan Street renders)
  brick: '#e09f3c', mortar: '#c48c42', coping: '#ebb24e',
  navy: '#2f3f4d', navyDeep: '#26333f', gold: '#e6c47c',
  // The Tamil Prince (sampled from the photos)
  stock: '#c4ad7c', stockMortar: '#a89468',
  white: '#f4f1ea', whiteShade: '#e2ddd2',
  green: '#1d4a3b', greenDeep: '#163a2e', cream: '#efe6cf', brass: '#c9a35a',
  // Street
  stucco: '#f1ebe1', stone: '#ddd5c8', paving: '#ece3d4', kerb: '#cfc8bc',
  asphalt: '#64656b', base: '#d2b49c', roof: '#c9beb0',
  red: '#c9322c', iron: '#232326', trunk: '#8c5f4a', frame: '#f8f5ef',
  interior: '#efe0c6', floor: '#b88b60', glassDay: '#8ea3b1', windowDay: '#7b8f9d',

// ── Renderer, scene, camera ────────────────────────────────────────────────────
const stage = document.getElementById('stage');
// The canvas presents through the system compositor, and on an iOS WebView a layered canvas
// can be shown unevenly even when the page produces every frame on time. So: an opaque
// context (no blend with the page), its own compositor layer (the CSS below), and on phones

// phones present more evenly than 60.
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: opts.transparent, premultipliedAlpha: !opts.transparent ? true : undefined, preserveDrawingBuffer: false, desynchronized: coarse, powerPreference: 'high-performance' });
const RENDER_HZ = params.get('hz') === '30' ? 30 : 0;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.maxPixelRatio));
renderer.setClearColor(opts.transparent ? 0x000000 : 0xf4efe8, opts.transparent ? 0 : 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Neutral tone mapping keeps the brick reds and pub greens rich, like a product render.
renderer.toneMapping = THREE.NeutralToneMapping;

stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(24, 1, 1.2, 900);   // near 1.2: nothing sits closer, and depth precision at distance scales with it

// ── Helpers ────────────────────────────────────────────────────────────────────

// shader keeps its own instance, since those are set up or animated per object.

const M = {
  mortar: mat(C.mortar, { roughness: 0.95 }),
  coping: mat(C.coping, { roughness: 0.7 }),
  navy: mat(C.navy, { roughness: 0.55 }),
  navyDeep: mat(C.navyDeep, { roughness: 0.6 }),
  stockMortar: mat(C.stockMortar, { roughness: 0.95 }),
  white: mat(C.white, { roughness: 0.75 }),
  whiteShade: mat(C.whiteShade, { roughness: 0.8 }),
  green: mat(C.green, { roughness: 0.55 }),
  awning: addMotion(mat('#185843', { roughness: 0.75, side: THREE.DoubleSide }), 'awning', { world: `wOff.y += sin(uTime * 1.8 + ip.x * 1.3 + ip.z * 0.9) * 0.012 * gust;` }),
  awningArm: mat('#8d9296', { roughness: 0.35, metalness: 0.7 }),
  greenDeep: mat(C.greenDeep, { roughness: 0.6 }),
  stucco: mat(C.stucco, { roughness: 0.8 }),
  stone: mat(C.stone, { roughness: 0.85 }),
  base: mat(C.base, { roughness: 0.9 }),
  roof: mat(C.roof, { roughness: 0.95 }),
  asphalt: null,   // set below, once the tarmac texture exists
  kerb: mat('#b6b3ad', { roughness: 0.75 }),
  red: mat(C.red, { roughness: 0.45 }),
  postRed: mat('#c4161c', { roughness: 0.38, clearcoat: 0.25, clearcoatRoughness: 0.4 }),
  iron: mat(C.iron, { roughness: 0.45, metalness: 0.3 }),
  ironGreen: mat('#26372f', { roughness: 0.5, metalness: 0.25 }),
  trunk: mat(C.trunk, { roughness: 0.9 }),
  frame: mat(C.frame, { roughness: 0.6 }),
  brass: mat('#c9a35a', { roughness: 0.35, metalness: 0.7 }),
  floor: mat(C.floor, { roughness: 0.7 }),
  pubFloor: mat('#5b3b27', { roughness: 0.6 }),
  wood: mat('#a07049', { roughness: 0.75 }),
  darkWood: mat('#5a3a26', { roughness: 0.55 }),
  bread: mat('#d29a55', { roughness: 0.8 }),
  paper: mat('#e9dcc3', { roughness: 0.9 }),
  planter: mat('#1f2326', { roughness: 0.55 }),
  soil: mat('#4a3b30', { roughness: 1 }),
  olive: mat('#7a8a55', { roughness: 0.85 }),
  oliveLight: mat('#a3b07a', { roughness: 0.85 }),
  terracotta: mat('#b8653f', { roughness: 0.8 }),
  // These change between day and night.
  interior: mat(C.interior, { emissive: '#ffb45c', emissiveIntensity: 0 }),
  pubInterior: mat('#2f4b3f', { emissive: '#ffad55', emissiveIntensity: 0 }),
  shopGlass: new THREE.MeshStandardMaterial({ color: '#4f606a', roughness: 0.05, metalness: 0.3, transparent: true, opacity: 0.6, emissive: '#ffca7a', emissiveIntensity: 0, depthWrite: false }),
  pubGlass: new THREE.MeshStandardMaterial({ color: '#4a585e', roughness: 0.06, metalness: 0.2, transparent: true, opacity: 0.62, emissive: '#ffb866', emissiveIntensity: 0, depthWrite: false }),
  windowGlass: mat(C.windowDay, { roughness: 0.06, metalness: 0.45, envMapIntensity: 1.6, emissive: '#ffcf86', emissiveIntensity: 0 }),
  windowDark: mat(C.windowDay, { roughness: 0.06, metalness: 0.45, envMapIntensity: 1.6 }),
  lampGlass: mat('#f3ead6', { roughness: 0.3, emissive: '#ffbd6b', emissiveIntensity: 0 }),
  pendant: mat('#f6efe2', { roughness: 0.4, emissive: '#ffc173', emissiveIntensity: 0 }),
  taxiLight: mat('#f2c230', { roughness: 0.4, emissive: '#ffcf40', emissiveIntensity: 0 }),

// Tarmac: fine aggregate speckle on a canvas, sampled by world x/z so it never stretches.
const tarmacTexture = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const img = g.createImageData(256, 256), r = rng(31337);
  for (let i = 0; i < 256 * 256; i++) {
    const v = 160 + (r() - 0.5) * 16 + (r() < 0.03 ? -28 : r() < 0.02 ? 24 : 0);
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < 40; i++) {                                   // faint patches and repairs
    g.fillStyle = `rgba(${r() < 0.5 ? 0 : 255},${r() < 0.5 ? 0 : 255},${r() < 0.5 ? 0 : 255},0.025)`;
    g.beginPath(); g.ellipse(r() * 256, r() * 256, 10 + r() * 40, 8 + r() * 30, r() * 3, 0, Math.PI * 2); g.fill();

M.pavement = worldMapped(mat('#f2eee8', { roughness: 0.85 }), 0.5);
// Pavements: seamless tarmac (one flat box per cell, all the same tone) with flagstones
// only where a cell is given its own colour (the station square).
function pavingInstances(cells, y = 0.03) {

  const m4 = new THREE.Matrix4(), col = new THREE.Color();

    const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1.002, 0.12, 1.002), M.pavement, tar.length);

    tar.forEach(([x, z], k) => im.setMatrixAt(k, m4.makeTranslation(x, y, z)));
    world.add(im);
  }
  if (flags.length) {
    const im = new THREE.InstancedMesh(new RoundedBoxGeometry(0.98, 0.12, 0.98, 2, 0.018), mat('#ffffff', { roughness: 0.8 }), flags.length);
    im.receiveShadow = true;
    flags.forEach(([x, z, color], k) => {
      im.setMatrixAt(k, m4.makeTranslation(x, y, z));
      im.setColorAt(k, col.set(color).offsetHSL(0, 0, (rand() - 0.5) * 0.035));

const geoCache = new Map();
// A rounded box is ~108 triangles even at one segment; a plain box is 12. On the lite tier
// (phones) a part whose smallest side is under 25 cm gets a plain box: at phone scale its
// bevel is invisible, and window bars and mouldings are most of the street's triangles.
function rbox(w, h, d, r = 0.05, seg = 1) {
  const plain = tier === 'lite' && Math.min(w, h, d) < 0.4;
  const key = (plain ? 'p|' : '') + [w, h, d, r, seg].map(v => +v.toFixed(3)).join('|');

// Every mesh remembers which venue it belongs to, so a tap can focus that venue.
let currentPlace = null;
function mesh(geo, material, shadow = true) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = shadow; m.receiveShadow = true;

}
const world = new THREE.Group();
scene.add(world);
function add(obj, x = 0, y = 0, z = 0, rotY = 0) {

}
function child(group, obj, x = 0, y = 0, z = 0) {

const COURSE = 0.18, BRICK = 0.4, GAP = 0.028;
const bricks = [];
function layBricks(f, y0, y1, { color = f.brick, s0 = 0, s1 = f.len } = {}) {
  // color may be a list, for mixed old brick.
  const palette = [].concat(color).map(c => new THREE.Color(c));
  const r0 = Math.ceil(y0 / COURSE - 1e-6), r1 = Math.floor(y1 / COURSE + 1e-6);
  for (let r = r0; r < r1; r++) {
    const yc = (r + 0.5) * COURSE;
    let spans = [[s0, s1]];
    for (const [a, b, ya, yb] of f.openings) {
      if (yc < ya || yc > yb) continue;
      spans = spans.flatMap(([p, q]) => [[p, Math.min(q, a)], [Math.max(p, b), q]].filter(([m, n]) => n - m > 0.02));
    }
    const shift = (r % 2) * BRICK / 2;
    for (const [p, q] of spans) {
      for (let s = s0 - shift; s < q; s += BRICK) {
        const a = Math.max(s + GAP / 2, p + GAP / 2), b = Math.min(s + BRICK - GAP / 2, q - GAP / 2);
        if (b - a < 0.07) continue;
        const k = rand();
        const tint = palette[Math.floor(rand() * palette.length)].clone().offsetHSL((rand() - 0.5) * 0.015, (rand() - 0.5) * 0.05, (rand() - 0.5) * 0.045 + (k < 0.05 ? -0.04 : k > 0.96 ? 0.035 : 0));

}

function buildBricks() {

  // the mortar gap, not from geometry.
  const geo = new THREE.BoxGeometry(1, 1, 1);

  brickMesh.castShadow = true; brickMesh.receiveShadow = true;

  bricks.forEach((b, i) => {
    q.setFromAxisAngle(up, b.f.rotY);
    sc.set(b.w, b.h, 0.08);
    brickMesh.setMatrixAt(i, m4.compose(facePoint(b.f, b.s, b.y, 0.04), q, sc));
    brickMesh.setColorAt(i, b.color);

const signs = [];

  const canvas = document.createElement('canvas');

  let total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  if (maxW && total > maxW) {
    const k = maxW / total;
    g.font = g.font.replace(/(\d+(\.\d+)?)px/, (_, n) => `${(+n * k).toFixed(1)}px`);
    spacing *= k;
    widths = chars.map(c => g.measureText(c).width);
    total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);

// ── Shared building parts ──────────────────────────────────────────────────────
function sashWindow(f, s, y0, w, h, { surround = false, lintel = true, glass = M.windowGlass, surroundMat = M.stucco, panes = 'six', frame = M.frame } = {}) {
  f.openings.push([s - w / 2 - 0.02, s + w / 2 + 0.02, y0 - 0.02, y0 + h + (lintel ? 0.42 : surround ? 0.2 : 0.02)]);
  faceBox(f, w - 0.06, h - 0.06, 0.04, glass, s, y0 + h / 2, 0.0, 0.01);
  const t = 0.08, d = 0.1, o = 0.05;
  faceBox(f, w, t, d, frame, s, y0 + t / 2, o);
  faceBox(f, w, t, d, frame, s, y0 + h - t / 2, o);
  faceBox(f, t, h, d, frame, s - w / 2 + t / 2, y0 + h / 2, o);
  faceBox(f, t, h, d, frame, s + w / 2 - t / 2, y0 + h / 2, o);
  faceBox(f, w, 0.07, d, frame, s, y0 + h / 2, o + 0.01);
  faceBox(f, 0.035, h, 0.06, frame, s, y0 + h / 2, o);
  if (panes === 'six') {
    faceBox(f, w, 0.035, 0.06, frame, s, y0 + h * 0.75, o);

  if (lintel) {

    const lw = (w + 0.16) / n;
    for (let i = 0; i < n; i++) {
      bricks.push({ f, s: s - (w + 0.16) / 2 + lw * (i + 0.5), y: y0 + h + 0.2, w: lw - 0.035, h: 0.36, color: new THREE.Color(f.brick).offsetHSL(0, 0.04, -0.07 + (rand() - 0.5) * 0.05), place: currentPlace });
    }

  if (surround) {
    faceBox(f, w + 0.32, 0.16, 0.12, surroundMat, s, y0 + h + 0.1, 0.08);
    faceBox(f, 0.14, h + 0.1, 0.12, surroundMat, s - w / 2 - 0.08, y0 + h / 2, 0.08);
    faceBox(f, 0.14, h + 0.1, 0.12, surroundMat, s + w / 2 + 0.08, y0 + h / 2, 0.08);
  }
}

// Front door up a flight of steps, with a stucco portico and area railings.
// o is where the wall surface sits relative to the face line.
function portico(f, s, { door = C.red, o = 0, steps = 3, railFrom = 0, railTo = f.len, surround = M.stucco } = {}) {
  const doorY = steps * 0.18;
  const doorMat = mat(door, { roughness: 0.45 });
  const panelMat = mat(new THREE.Color(door).offsetHSL(0, 0, -0.05), { roughness: 0.45 });
  f.openings.push([s - 0.72, s + 0.72, -1, doorY + 2.8]);
  faceBox(f, 0.82, 1.9, 0.08, doorMat, s, doorY + 0.95, o + 0.02, 0.03);
  for (const [dx, dy] of [[-0.18, 0.5], [0.18, 0.5], [-0.18, 1.3], [0.18, 1.3]]) {
    faceBox(f, 0.26, 0.6, 0.04, panelMat, s + dx, doorY + dy, o + 0.07, 0.02);
  }
  faceBox(f, 0.08, 0.08, 0.06, M.brass, s, doorY + 1.15, o + 0.1, 0.03);
  onFace(f, mesh(new THREE.CircleGeometry(0.38, 24, 0, Math.PI), M.windowGlass, false), s, doorY + 1.92, o + 0.02);
  for (const dx of [-0.6, 0.6]) faceBox(f, 0.2, 2.4, 0.26, surround, s + dx, doorY + 1.2, o + 0.1, 0.05);
  faceBox(f, 1.56, 0.26, 0.42, surround, s, doorY + 2.5, o + 0.16, 0.05);
  faceBox(f, 1.7, 0.08, 0.5, surround, s, doorY + 2.66, o + 0.18, 0.03);
  for (let i = 0; i < steps; i++) {
    const depth = 0.3 * (steps - i);
    faceBox(f, 1.26, 0.18, depth, M.stone, s, 0.09 + i * 0.18, depth / 2 + o - 0.1, 0.025);
  }
  const list = [];
  const front = 0.3 * steps + o - 0.05;
  for (const dx of [-0.66, 0.66]) for (let z = o; z <= front; z += 0.11) list.push([s + dx, 0.1, 1.0, z]);
  for (let x = railFrom + 0.05; x < s - 0.7; x += 0.11) list.push([x, 0.1, 1.0, front]);
  for (let x = s + 0.75; x < railTo - 0.05; x += 0.11) list.push([x, 0.1, 1.0, front]);
  bars(f, list, 0.018, M.iron, true);
  for (const dx of [-0.66, 0.66]) faceBox(f, 0.04, 0.04, front - o, M.iron, s + dx, 1.02, (front + o) / 2, 0.015);
  if (s - 0.75 - railFrom > 0.1) faceBox(f, s - 0.75 - railFrom, 0.04, 0.04, M.iron, (railFrom + s - 0.7) / 2, 1.02, front, 0.015);
  if (railTo - s - 0.75 > 0.1) faceBox(f, railTo - s - 0.75, 0.04, 0.04, M.iron, (s + 0.75 + railTo) / 2, 1.02, front, 0.015);
}

function chimney(x, z, y, { color = C.brick, pots = 3 } = {}) {
  const w = 0.6 + pots * 0.32;
  add(mesh(rbox(w, 1.3, 0.75, 0.06), mat(color, { roughness: 0.9 })), x, y + 0.65, z);
  add(mesh(rbox(w + 0.14, 0.14, 0.89, 0.04), M.stone), x, y + 1.33, z);
  for (let i = 0; i < pots; i++) {

      child(g, mesh(rbox(0.05, 0.05, 0.28, 0.01), M.iron), 0, 2.28, 0.14);
      child(g, mesh(rbox(0.22, 0.32, 0.22, 0.02), M.lampGlass, false), 0, 2.1, 0.32);
      for (const [dx, dz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) child(g, mesh(rbox(0.03, 0.34, 0.03, 0.01), M.iron), dx * 0.11, 2.1, 0.32 + dz * 0.11);
      child(g, mesh(new THREE.ConeGeometry(0.19, 0.16, 4), M.iron), 0, 2.34, 0.32).rotation.y = Math.PI / 4;
      child(g, mesh(rbox(0.16, 0.05, 0.16, 0.01), M.iron), 0, 1.93, 0.32);
      onFace(f, g, s, 0, 0.21);
      g.position.y = 0;
    }
  };
  const pubWindow = (f, s0, s1, { lettering = false } = {}) => {
    const w = s1 - s0, s = (s0 + s1) / 2, y0 = 0.8, h = 1.6, r = 0.24;
    onFace(f, mesh(new THREE.ShapeGeometry(topRound(w, h, r), 12), M.pubGlass, false), s, y0, 0.0);
    onFace(f, mesh(ringGeo(w, h, r, 0.07, 0.08), M.white), s, y0, 0.0);
    faceBox(f, w + 0.1, 0.1, 0.26, M.white, s, y0 - 0.03, 0.12, 0.03);             // cill
    faceBox(f, w + 0.02, 0.76, 0.16, M.white, s, 0.38, 0.06, 0.03);                 // stallriser
    faceBox(f, w - 0.3, 0.42, 0.04, M.whiteShade, s, 0.38, 0.15, 0.015);
    if (lettering) onFace(f, canvasPlane(w * 0.88, 0.3, glassLettering, { transparent: true, glow: 0.6 }), s, y0 + 0.62, 0.025);
  };
  const fascia = (f, s0, s1) => {
    const w = s1 - s0, s = (s0 + s1) / 2;
    faceBox(f, w, 0.24, 0.06, M.white, s, 2.53, 0.02, 0.01);                        // head
    faceBox(f, w + 0.1, 0.46, 0.36, M.green, s, 2.8, 0.24, 0.05);
    onFace(f, canvasPlane(w - 0.1, 0.38, pubSign('THE TAMIL PRINCE')), s, 2.8, 0.425);
  };

  // Hemingford Road: two windows, then the flats' own front door.
  pilaster(fFront, CH + 0.15);
  pubWindow(fFront, 1.6, 3.15, { lettering: true });
  pilaster(fFront, 3.3, { lantern: true });
  pubWindow(fFront, 3.45, 4.95, { lettering: true });
  pilaster(fFront, 5.1);
  fascia(fFront, CH, 5.25);
  {
    const s = 6.35;
    faceBox(fFront, 2.25, G1, 0.06, M.white, 6.375, G1 / 2, 0.03, 0.01);
    faceBox(fFront, 0.92, 2.2, 0.08, mat('#141517', { roughness: 0.45 }), s, 1.24, 0.08, 0.03);
    for (const dy of [0.7, 1.55]) for (const dx of [-0.2, 0.2]) faceBox(fFront, 0.3, 0.6, 0.04, mat('#1d1f22', { roughness: 0.45 }), s + dx, 0.14 + dy, 0.13, 0.02);
    faceBox(fFront, 0.08, 0.08, 0.06, M.brass, s + 0.3, 1.25, 0.15, 0.03);
    faceBox(fFront, 0.92, 0.36, 0.04, M.windowGlass, s, 2.58, 0.07, 0.01);
    faceBox(fFront, 0.18, 2.8, 0.18, M.white, s - 0.58, 1.4, 0.1, 0.04);
    faceBox(fFront, 0.18, 2.8, 0.18, M.white, s + 0.58, 1.4, 0.1, 0.04);
    faceBox(fFront, 1.4, 0.14, 0.3, M.white, s, 2.88, 0.14, 0.04);
    faceBox(fFront, 1.3, 0.14, 0.45, M.stone, s, 0.07, 0.25, 0.03);
  }

  // Canted corner: double doors under the black "115" transom sign.
  pilaster(fCham, 0.15);
  pilaster(fCham, fCham.len - 0.15);
  {
    const s = fCham.len / 2, w = 1.1;
    faceBox(fCham, fCham.len, G1 - 2.3, 0.05, M.white, s, (G1 + 2.3) / 2, 0.02, 0.01);
    onFace(fCham, canvasPlane(1.0, 0.4, numberSign, { glow: 0.4 }), s, 2.68, 0.06);
    for (const side of [-1, 1]) {
      const ds = s + side * w / 4;
      faceBox(fCham, w / 2 - 0.02, 2.18, 0.06, M.white, ds, 1.2, -0.04, 0.02);
      faceBox(fCham, w / 2 - 0.16, 1.45, 0.03, M.pubGlass, ds, 1.45, 0.0, 0.01);
      faceBox(fCham, w / 2 - 0.18, 0.4, 0.03, M.whiteShade, ds, 0.38, 0.0, 0.01);
      faceBox(fCham, 0.03, 0.35, 0.05, M.brass, s + side * 0.06, 1.15, 0.02, 0.01);
    }
    faceBox(fCham, 1.6, 0.14, 0.62, mat('#5e6266', { roughness: 0.8 }), s, 0.07, 0.3, 0.03);
  }

  // Bridgeman Road: side door, then two windows up to the corner.
  {
    faceBox(fSide, 1.0, G1, 0.06, M.white, 0.5, G1 / 2, 0.03, 0.01);
    faceBox(fSide, 0.78, 2.1, 0.08, M.white, 0.55, 1.1, 0.07, 0.03);
    faceBox(fSide, 0.5, 1.0, 0.03, M.windowGlass, 0.55, 1.55, 0.115, 0.01);
    faceBox(fSide, 0.95, 0.12, 0.26, M.white, 0.55, 2.24, 0.12, 0.03);
    faceBox(fSide, 1.0, 0.12, 0.4, M.stone, 0.55, 0.06, 0.2, 0.03);
  }
  pilaster(fSide, 1.1);
  pubWindow(fSide, 1.25, 2.7, { lettering: true });
  pilaster(fSide, 2.85, { lantern: true });
  pubWindow(fSide, 3.0, 4.45, { lettering: true });
  pilaster(fSide, 4.6);
  fascia(fSide, 0.95, SIDE - CH);

  // Retractable awnings, pulled out as in the street photos: one long one on Hemingford
  // Road, two side by side on Bridgeman Road. Valance lettering in cream.
  const valance = (g, W, H) => {
    g.fillStyle = '#185843'; g.fillRect(0, 0, W, H);
    g.fillStyle = C.cream; g.textBaseline = 'middle';
    g.font = `600 ${Math.round(H * 0.5)}px "Cormorant Garamond", "Newsreader", Georgia, serif`;
    spacedText(g, 'THE TAMIL PRINCE', W / 2, H * 0.55, H * 0.1, W * 0.6);
  };
  const awning = (f, s0, s1) => {
    const w = s1 - s0, s = (s0 + s1) / 2, top = 3.06, P = 1.55, drop = 0.72;
    const len = Math.hypot(P, drop), tilt = Math.atan2(drop, P);
    const g = new THREE.Group();
    const canvas = child(g, mesh(rbox(w, 0.035, len, 0.012), M.awning), 0, top - drop / 2, P / 2);
    canvas.rotation.x = tilt;
    child(g, mesh(rbox(w + 0.04, 0.13, 0.16, 0.05), M.greenDeep), 0, top + 0.02, 0.08);          // cassette
    child(g, mesh(new THREE.CylinderGeometry(0.03, 0.03, w, 8), M.awningArm), 0, top - drop - 0.02, P).rotation.z = Math.PI / 2;
    child(g, mesh(rbox(w, 0.26, 0.025, 0.008), M.awning), 0, top - drop - 0.14, P + 0.02);      // valance
    for (const side of [-1, 1]) {
      const arm = child(g, mesh(rbox(0.035, 0.035, 1.52, 0.01), M.awningArm), side * (w / 2 - 0.25), top - 0.68, P / 2 + 0.03);
      arm.rotation.x = 0.08;
      child(g, mesh(rbox(0.08, 0.14, 0.06, 0.02), M.awningArm), side * (w / 2 - 0.25), top - 0.62, 0.05);
    }
    const text = canvasPlane(w - 0.1, 0.24, valance, { glow: 0.2 });
    child(g, text, 0, top - drop - 0.14, P + 0.04);
    onFace(f, g, s, 0, 0.0);
  };
  if (opts.awnings) {
    awning(fFront, 1.42, 5.12);
    awning(fSide, 1.12, 2.82);
    awning(fSide, 2.88, 4.58);
  }

  // Entablature over the ground floor, squared off at the corner overhang.
  faceBox(fFront, 7.8, 0.36, 0.42, M.white, 3.6, G1 + 0.2, 0.2, 0.05);
  faceBox(fFront, 7.9, 0.08, 0.52, M.white, 3.6, G1 + 0.42, 0.25, 0.03);
  faceBox(fSide, 6.3, 0.36, 0.42, M.white, 3.15, G1 + 0.2, 0.2, 0.05);
  faceBox(fSide, 6.4, 0.08, 0.52, M.white, 3.2, G1 + 0.42, 0.25, 0.03);

  // ── Upper floors ──
  const quoins = (f, sC, w, y0, y1) => {
    f.openings.push([sC - w / 2 - 0.02, sC + w / 2 + 0.02, y0, y1]);
    for (let y = y0; y + 0.38 <= y1 + 0.01; y += 0.44) faceBox(f, w, 0.4, 0.16, M.white, sC, y + 0.2, 0.06, 0.04);
  };
  const frenchWindow = (f, s, y0, w, h, glass) => {
    f.openings.push([s - w / 2 - 0.3, s + w / 2 + 0.3, y0 - 0.12, y0 + h + 0.46]);
    faceBox(f, w - 0.06, h - 0.06, 0.04, glass, s, y0 + h / 2, 0, 0.01);
    const t = 0.08, o = 0.05;
    faceBox(f, w, t, 0.1, M.frame, s, y0 + t / 2, o);
    faceBox(f, w, t, 0.1, M.frame, s, y0 + h - t / 2, o);
    faceBox(f, t, h, 0.1, M.frame, s - w / 2 + t / 2, y0 + h / 2, o);
    faceBox(f, t, h, 0.1, M.frame, s + w / 2 - t / 2, y0 + h / 2, o);
    faceBox(f, 0.07, h * 0.78, 0.1, M.frame, s, y0 + h * 0.39, o);
    faceBox(f, w, 0.06, 0.1, M.frame, s, y0 + h * 0.78, o);
    for (const k of [0.2, 0.4, 0.6]) faceBox(f, w, 0.03, 0.06, M.frame, s, y0 + h * k, o);
    for (const k of [-0.25, 0.25]) faceBox(f, 0.03, h * 0.78, 0.06, M.frame, s + w * k, y0 + h * 0.39, o);
    for (const side of [-1, 1]) {
      const ps = s + side * (w / 2 + 0.15);
      faceBox(f, 0.2, h + 0.1, 0.12, M.white, ps, y0 + h / 2, 0.08, 0.03);
      for (const k of [-0.045, 0.045]) faceBox(f, 0.025, h - 0.2, 0.02, M.whiteShade, ps + k, y0 + h / 2, 0.145, 0.008);
    }
    faceBox(f, w + 0.5, 0.24, 0.14, M.white, s, y0 + h + 0.14, 0.08, 0.03);           // frieze
    faceBox(f, w + 0.68, 0.16, 0.32, M.white, s, y0 + h + 0.33, 0.16, 0.04);          // hood
    for (const side of [-1, 1]) faceBox(f, 0.12, 0.32, 0.24, M.white, s + side * (w / 2 + 0.24), y0 + h + 0.12, 0.13, 0.04);
    faceBox(f, w + 0.5, 0.1, 0.26, M.white, s, y0 - 0.05, 0.12, 0.03);
    // Juliet balcony.
    const list = [];
    for (let k = s - w / 2 + 0.06; k <= s + w / 2 - 0.05; k += 0.085) list.push([k, y0 + 0.02, 0.76, 0.2]);
    bars(f, list, 0.012);
    faceBox(f, w + 0.12, 0.04, 0.06, M.iron, s, y0 + 0.79, 0.2, 0.015);
    faceBox(f, w + 0.12, 0.035, 0.05, M.iron, s, y0 + 0.08, 0.2, 0.012);
  };
  const archWindow = (f, s, y0, w, h, { glass, blind = false }) => {
    const r = w / 2;
    f.openings.push([s - w / 2 - 0.24, s + w / 2 + 0.24, y0 - 0.12, y0 + h + 0.34]);
    onFace(f, mesh(new THREE.ShapeGeometry(topRound(w, h, r), 16), blind ? M.whiteShade : glass, !blind), s, y0, 0.0);
    onFace(f, mesh(ringGeo(w, h, r, 0.07, 0.08), M.frame), s, y0, 0.0);
    onFace(f, mesh(ringGeo(w + 0.14, h + 0.07, r + 0.07, 0.15, 0.08), M.white), s, y0 - 0.07, 0.03);
    faceBox(f, 0.18, 0.3, 0.16, M.white, s, y0 + h + 0.16, 0.1, 0.03);                // keystone
    faceBox(f, w + 0.4, 0.1, 0.24, M.white, s, y0 - 0.05, 0.12, 0.03);
    if (!blind) {
      faceBox(f, w, 0.06, 0.09, M.frame, s, y0 + (h - r) * 0.55, 0.05);
      faceBox(f, 0.035, h - r * 0.4, 0.06, M.frame, s, y0 + (h - r * 0.4) / 2, 0.05);
    }
  };
  const blindWindow = (f, s, y0, w, h) => {
    f.openings.push([s - w / 2 - 0.14, s + w / 2 + 0.14, y0 - 0.12, y0 + h + 0.12]);
    faceBox(f, w + 0.24, h + 0.2, 0.1, M.white, s, y0 + h / 2, 0.05, 0.03);
    faceBox(f, w - 0.22, h * 0.55, 0.04, M.whiteShade, s, y0 + h * 0.66, 0.11, 0.015);
    faceBox(f, w - 0.22, h * 0.3, 0.04, M.whiteShade, s, y0 + h * 0.2, 0.11, 0.015);
  };
  const plaque = (f, s, y) => {
    f.openings.push([s - 0.6, s + 0.6, y - 0.52, y + 0.52]);
    faceBox(f, 1.1, 0.95, 0.1, M.white, s, y, 0.05, 0.04);
    faceBox(f, 0.9, 0.75, 0.04, M.whiteShade, s, y, 0.11, 0.02);
    faceBox(f, 0.36, 0.44, 0.08, M.white, s, y - 0.04, 0.15, 0.12);                   // shield
    faceBox(f, 0.5, 0.1, 0.06, M.white, s, y + 0.26, 0.15, 0.03);
    for (const side of [-1, 1]) {
      const sc = new THREE.Group();
      child(sc, mesh(new THREE.TorusGeometry(0.09, 0.03, 8, 16), M.white), 0, 0, 0);
      onFace(f, sc, s + side * 0.3, y + 0.05, 0.14);
    }
  };
  const hangingSign = (f, s, y) => {
    const g = new THREE.Group();
    child(g, mesh(rbox(0.05, 0.05, 1.0, 0.01), M.iron), 0, 0, 0.5);
    const strut = child(g, mesh(rbox(0.04, 0.04, 0.75, 0.01), M.iron), 0, -0.28, 0.33);
    strut.rotation.x = -0.75;
    child(g, mesh(rbox(0.05, 0.62, 0.66, 0.02), M.white), 0, -0.36, 0.6);
    child(g, mesh(rbox(0.07, 0.68, 0.72, 0.02), M.iron), 0, -0.36, 0.6).scale.set(0.6, 1, 1);
    onFace(f, g, s, y, 0.12);
  };

  const lit = seed => (rng(seed)() > 0.35 ? M.windowGlass : M.windowDark);
  // Hemingford Road elevation.
  quoins(fFront, 0.23, 0.74, F1, TOP);
  blindWindow(fFront, 1.05, 4.35, 0.7, 1.65);
  hangingSign(fFront, 1.05, 6.05);
  onFace(fFront, canvasPlane(1.0, 0.34, streetSign('HEMINGFORD ROAD', 'N1'), { glow: 0.15 }), 1.05, 3.88, 0.16);
  quoins(fFront, 1.86, 0.44, F1, TOP);
  frenchWindow(fFront, 3.25, 3.72, 1.0, 2.05, lit(1));
  frenchWindow(fFront, 5.55, 3.72, 1.0, 2.05, lit(2));
  quoins(fFront, 7.25, 0.5, F1, TOP);
  archWindow(fFront, 1.05, 6.72, 0.75, 1.42, { blind: true });
  archWindow(fFront, 3.25, 6.72, 0.85, 1.48, { glass: lit(3) });
  archWindow(fFront, 5.55, 6.72, 0.85, 1.48, { glass: lit(4) });

  // Bridgeman Road elevation.
  quoins(fSide, SIDE - 0.3, 0.6, F1, TOP);
  quoins(fSide, 0.25, 0.5, F1, TOP);
  onFace(fSide, canvasPlane(1.0, 0.34, streetSign('BRIDGEMAN ROAD', 'N1'), { glow: 0.15 }), 4.95, 3.88, 0.16);
  sashWindow(fSide, 1.55, 3.95, 0.92, 1.75, { surround: true, lintel: false, glass: lit(5), surroundMat: M.white });
  sashWindow(fSide, 4.55, 3.95, 0.92, 1.75, { surround: true, lintel: false, glass: lit(6), surroundMat: M.white });
  archWindow(fSide, 1.55, 6.72, 0.8, 1.45, { glass: lit(7) });
  plaque(fSide, 3.05, 7.35);
  archWindow(fSide, 4.55, 6.72, 0.8, 1.45, { glass: lit(8) });

  // String course and the main cornice with dentils.
  for (const [f, len, extra] of [[fFront, 7.5, 0.3], [fSide, SIDE, 0.3]]) {
    const s0 = f === fFront ? -extra : 0, s1 = f === fFront ? len : len + extra;
    faceBox(f, s1 - s0, 0.18, 0.26, M.white, (s0 + s1) / 2, F2 + 0.09, 0.13, 0.04);
    faceBox(f, s1 - s0, 0.3, 0.46, M.white, (s0 + s1) / 2, TOP + 0.2, 0.23, 0.05);
    faceBox(f, s1 - s0 + 0.1, 0.1, 0.56, M.white, (s0 + s1) / 2, TOP + 0.4, 0.28, 0.03);
    const dent = [];
    for (let s = s0 + 0.1; s < s1 - 0.05; s += 0.2) {
      const p = facePoint(f, s, TOP - 0.03, 0.08);
      dent.push(new THREE.BoxGeometry(0.1, 0.12, 0.16).rotateY(f.rotY).translate(p.x, p.y, p.z));
    }
    world.add(mesh(mergeGeometries(dent), M.white));
  }

  layBricks(fFront, F1, TOP);
  layBricks(fFront, TOP + 0.45, PAR);
  layBricks(fSide, F1, TOP);
  layBricks(fSide, TOP + 0.45, PAR);
  for (const s of [1.6, 4.0, 6.0]) {
    sashWindow(fBack, s, 3.95, 0.9, 1.6, { glass: lit(10 + s) });
    sashWindow(fBack, s, 6.75, 0.9, 1.4, { glass: lit(20 + s) });
  }
  sashWindow(fBack, 4.6, 0.95, 0.95, 1.4, { glass: M.windowDark });
  fBack.openings.push([1.1, 2.1, -1, 2.45]);
  faceBox(fBack, 0.9, 2.0, 0.1, mat('#2b3a33', { roughness: 0.5 }), 1.6, 1.0, 0.0, 0.03);
  layBricks(fBack, 0, PAR);

  chimney(X0 + 1.3, ZB + 0.7, TOP, { color: C.stock, pots: 3 });
  chimney(X1 - 1.6, ZB + 0.7, TOP, { color: C.stock, pots: 4 });

  // ── Inside: green walls, a bar of bottles and brass globe pendants ──
  add(mesh(rbox(2.6, 1.05, 0.5, 0.05), M.darkWood), -18.0, 0.53, 1.2);
  add(mesh(rbox(2.7, 0.06, 0.6, 0.02), M.brass), -18.0, 1.08, 1.2);
  for (const y of [1.45, 1.9]) add(mesh(rbox(2.5, 0.04, 0.2, 0.01), M.darkWood), -18.0, y, 0.98);
  {
    const r = rng(77);
    const tints = ['#3d6b4a', '#7a4a22', '#c9a35a', '#e8e2d0', '#5a2a2a'].map(c => mat(c, { roughness: 0.2, metalness: 0.1 }));
    const geos = tints.map(() => []);
    for (const y of [1.47, 1.92]) for (let x = -19.15; x < -16.8; x += 0.1) {
      const h = 0.22 + r() * 0.12;
      geos[Math.floor(r() * tints.length)].push(new THREE.CylinderGeometry(0.035, 0.04, h, 6).translate(x, y + h / 2, 0.98));
    }
    geos.forEach((list, i) => list.length && world.add(mesh(mergeGeometries(list), tints[i], false)));
  }
  for (let x = -19.0; x < -16.9; x += 0.7) {
    add(mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.05, 12), M.darkWood), x, 0.75, 1.7);
    add(mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.72, 6), M.brass), x, 0.37, 1.7);
  }
  for (const [x, z] of [[-19.4, 1.85], [-18.2, 1.9], [-17.0, 1.85], [-20.8, 0.2], [-20.8, -1.4]]) {
    add(mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.45, 4), M.brass, false), x, G1 - 0.22, z);
    add(mesh(new THREE.SphereGeometry(0.14, 16, 12), M.pendant, false), x, G1 - 0.55, z);
  }
  for (const [x, z] of [[-18.2, 1.9], [-20.7, -0.6], [-20.9, 1.7]]) {
    const l = new THREE.PointLight('#ffad55', 0, 5.5, 1.4);
    l.position.set(x, 2.2, z); world.add(l);
    nightLights.push({ light: l, max: 7 });
  }

  // ── Outside: benches, olive trees and the corner lamp ──
  oliveTree(X0 + CH + 0.25, ZF + 0.45, 11);
  oliveTree(X0 - 0.45, ZF - CH - 0.25, 12);
  picnicTable(-23.55, -1.75, Math.PI / 2);
  picnicTable(-23.55, 0.55, Math.PI / 2);
  picnicTable(-23.4, 4.1, Math.PI / 2 + 0.15);
  picnicTable(-18.3, 4.15, 0);
  streetLamp(-24.9, 2.75);
  bollard(-21.6, 5.0); bollard(-24.9, 5.0);
  currentPlace = null;
  return { poly: GF, x0: X0, x1: X1, top: PAR + 0.16, party: face([X1, ZF], [X1, ZB], { brick }) };
}

// ── Filler terraces ────────────────────────────────────────────────────────────
// zf/zb: front and back lines. The default is the south side of the main road; pass
// zf < zb for a building on the north side, facing south across the road.
function house({ x0, x1, floors, brick = '#c9b27f', mortar = '#ab9668', ground = 'stucco', paint = null, door = '#1f2a44', doorSide = 'left', bay = false, boxes = false, balcony = false, chimneySide = 'left', seed = 1, zf = 2.5, zb = -3.5 }) {
  currentPlace = null;
  const r = rng(seed);
  const ZF = zf, ZB = zb, w = x1 - x0, north = ZB > ZF;
  const GH = 2.7, FH = 2.45;
  const top = GH + FH * (floors - 1), par = top + 0.55;
  const poly = rect(x0, x1, Math.min(ZF, ZB), Math.max(ZF, ZB));
  const paintMat = paint ? mat(paint, { roughness: 0.85 }) : null;
  const coreMat = paintMat || mat(mortar, { roughness: 0.95 });
  const groundMat = paintMat || (ground === 'stucco' ? M.stucco : coreMat);
  const f = north ? face([x1, ZF], [x0, ZF], { brick }) : face([x0, ZF], [x1, ZF], { brick });
  const fb = north ? face([x0, ZB], [x1, ZB], { brick }) : face([x1, ZB], [x0, ZB], { brick });
  const lit = () => (r() < 0.5 ? M.windowGlass : M.windowDark);
  const trim = paint || ground === 'stucco';

  prism(poly, 0, GH, groundMat);
  prism(poly, GH, top, coreMat);
  prism(poly, top, par, coreMat, { holes: [inset(poly, 0.22)] });
  prism(inset(poly, 0.21), top, top + 0.04, M.roof);
  prism(inset(poly, -0.04), par, par + 0.1, M.stone, { holes: [inset(poly, 0.26)], bevel: 0.03 });

  const doorS = doorSide === 'left' ? 0.72 : w - 0.72;
  const winS = doorSide === 'left' ? w - 0.85 : 0.85;
  if (ground === 'stucco' || paint) {
    const groove = mat(new THREE.Color(paint || C.stucco).offsetHSL(0, 0, -0.06));
    for (let y = 0.4; y < GH - 0.1; y += 0.38) faceBox(f, w, 0.025, 0.02, groove, w / 2, y, 0.01, 0.005);
    faceBox(f, w, 0.16, 0.2, paintMat || M.stucco, w / 2, GH - 0.02, 0.1, 0.04);
  }
  portico(f, doorS, { door, o: 0, steps: 2, surround: paintMat || M.stucco });
  if (bay) {
    const bw = 1.3, d = 0.55, s = winS - 0.15;
    f.openings.push([s - bw / 2, s + bw / 2, -1, 2.7]);
    faceBox(f, bw, 0.75, d, M.stucco, s, 0.38, d / 2, 0.04);
    faceBox(f, bw - 0.1, 1.5, 0.04, lit(), s, 1.5, d - 0.02, 0.01);
    for (const side of [-1, 1]) {
      faceBox(f, 0.04, 1.5, d - 0.1, M.windowDark, s + side * (bw / 2 - 0.02), 1.5, d / 2, 0.01);
      faceBox(f, 0.1, 1.6, 0.1, M.frame, s + side * (bw / 2 - 0.05), 1.5, d - 0.05, 0.02);
    }
    for (const k of [-1 / 6, 1 / 6]) faceBox(f, 0.06, 1.5, 0.08, M.frame, s + k * bw, 1.5, d - 0.02, 0.02);
    faceBox(f, bw, 0.06, 0.08, M.frame, s, 1.9, d - 0.02, 0.02);
    faceBox(f, bw + 0.12, 0.26, d + 0.12, M.stucco, s, 2.38, d / 2 + 0.03, 0.04);
  } else {
    sashWindow(f, winS, 0.85, 0.95, 1.55, { surround: trim, lintel: !trim, glass: lit(), surroundMat: paintMat || M.stucco });
  }
  for (let i = 1; i < floors; i++) {
    const y0 = GH + FH * (i - 1) + 0.42, h = i === 1 ? 1.62 : 1.38;
    for (const k of [0.27, 0.73]) {
      const s = w * k;
      sashWindow(f, s, y0, 0.74, h, { surround: !!paint, lintel: !paint, glass: lit(), surroundMat: paintMat || M.stucco });
      if (boxes && i === 1) {
        faceBox(f, 0.86, 0.2, 0.24, M.terracotta, s, y0 - 0.2, 0.25, 0.04);
        const r2 = rng(seed * 10 + i + k * 7), j0 = Math.round(k * 10);
        const fl = [], gr = [];
        for (let j = 0; j < 9; j++) {
          const p = facePoint(f, s - 0.36 + j * 0.09, y0 - 0.04 + r2() * 0.08, 0.25 + (r2() - 0.5) * 0.12);
          (r2() > 0.45 ? fl : gr).push(new THREE.SphereGeometry(0.06 + r2() * 0.03, 8, 6).translate(p.x, p.y, p.z));
        }
        world.add(mesh(mergeGeometries(fl), mat(['#c4552b', '#8e2f3a', '#e0952e'][j0 % 3], { roughness: 0.7 })));
        world.add(mesh(mergeGeometries(gr), mat('#6b6a3a', { roughness: 0.8 })));
      }
    }
    if (balcony && i === 1) {
      faceBox(f, w - 0.3, 0.08, 0.55, M.stucco, w / 2, y0 - 0.06, 0.28, 0.02);
      const list = [];
      for (let s = 0.2; s <= w - 0.2; s += 0.1) list.push([s, y0 - 0.02, 0.8, 0.52]);
      bars(f, list, 0.012);
      faceBox(f, w - 0.32, 0.04, 0.05, M.iron, w / 2, y0 + 0.8, 0.52, 0.015);
    }
  }
  faceBox(f, w, 0.22, 0.3, paintMat || M.stucco, w / 2, top + 0.06, 0.15, 0.04);
  if (!paint) {
    layBricks(f, ground === 'brick' ? 0 : GH + 0.06, top - 0.06);
    layBricks(f, top + 0.17, par);
  }
  for (let i = 0; i < floors; i++) {
    const y0 = i === 0 ? 0.9 : GH + FH * (i - 1) + 0.45;
    if (i === 0) {
      fb.openings.push([0.5, 1.4, -1, 2.45]);
      faceBox(fb, 0.85, 2.0, 0.1, mat('#3a3f45', { roughness: 0.5 }), 0.95, 1.0, 0, 0.03);
      sashWindow(fb, w - 0.85, y0, 0.8, 1.3, { glass: lit() });
    } else {
      for (const k of [0.3, 0.72]) sashWindow(fb, w * k, y0, 0.72, 1.3, { glass: lit() });
    }
  }
  layBricks(fb, 0, par);
  chimney(chimneySide === 'left' ? x0 : x1, ZF + (ZB - ZF) * 0.65, top, { color: brick, pots: 2 + (seed % 3) });
  return { poly, x0, x1, top: par + 0.1, brick };
}

// ── The Mae + Harvey block: shopfronts under slate mansards ────────────────────
Object.assign(M, {
  slate: mat('#4f555b', { roughness: 0.8 }),
  lead: mat('#6b7177', { roughness: 0.6, metalness: 0.2 }),
  paintWhite: mat('#f1efea', { roughness: 0.8 }),
  // Mae + Harvey's paint: a dark slate grey-blue sampled from the photos
  // (frames #2d343c, pilaster #222c34, fascia face ~#3d4140 in daylight).
  shopBlack: mat('#34404b', { roughness: 0.38, clearcoat: 0.25, clearcoatRoughness: 0.4 }),
  shopBlackDeep: mat('#2a333c', { roughness: 0.38, clearcoat: 0.25, clearcoatRoughness: 0.4 }),
  corbel: mat('#9c9e9b', { roughness: 0.85 }),
  bistro: mat('#4d5f78', { roughness: 0.45, metalness: 0.35 }),
  steel: mat('#c3c7ca', { roughness: 0.25, metalness: 0.85 }),
  oak: mat('#c9a072', { roughness: 0.65 }),
});

// Slate mansard from y0 to y1 across x0..x1, with dormers at the given x positions.
function mansard(x0, x1, y0, y1, dormers, seed, { zf = 2.5, zb = -3.5 } = {}) {
  const ZF = zf, ZB = zb, d = Math.sign(ZF - ZB);
  const prof = [[ZF - 0.12 * d, y0], [ZF - 1.0 * d, y1], [ZB + 1.0 * d, y1], [ZB + 0.12 * d, y0]];
  const geo = new THREE.ExtrudeGeometry(new THREE.Shape(prof.map(([z, y]) => new THREE.Vector2(-z, y))), { depth: x1 - x0, bevelEnabled: false });
  geo.rotateY(Math.PI / 2).translate(x0, 0, 0);
  world.add(mesh(geo, M.slate));
  add(mesh(rbox(x1 - x0, 0.08, 0.3, 0.02), M.lead), (x0 + x1) / 2, y0 + 0.02, ZF - 0.12 * d);
  const r = rng(seed);
  for (const x of dormers) {
    const zf = ZF - 0.34 * d, dy = y0 + 0.25, dh = 1.15;
    add(mesh(rbox(1.0, dh, 1.2, 0.04), M.slate), x, dy + dh / 2, zf - 0.6 * d);
    add(mesh(rbox(1.12, 0.1, 1.32, 0.03), M.lead), x, dy + dh + 0.05, zf - 0.6 * d);
    const fd = d > 0 ? face([x - 0.5, zf], [x + 0.5, zf]) : face([x + 0.5, zf], [x - 0.5, zf]);
    faceBox(fd, 0.84, 0.94, 0.06, M.frame, 0.5, dy + 0.53, 0.0, 0.02);
    faceBox(fd, 0.68, 0.78, 0.03, r() > 0.45 ? M.windowGlass : M.windowDark, 0.5, dy + 0.53, 0.035, 0.01);
    faceBox(fd, 0.68, 0.05, 0.05, M.frame, 0.5, dy + 0.56, 0.04, 0.01);
  }
}
// Segmental arch over a window (y from the window head up).
function archHead(f, s, yTop, w, material, { rise = 0.2, t = 0.26 } = {}) {
  const c = w + 0.3, R = (c * c / 4 + rise * rise) / (2 * rise), a = Math.asin(c / 2 / R), cy = yTop + rise - R;
  const sh = new THREE.Shape();
  sh.absarc(0, cy, R + t, Math.PI / 2 - a, Math.PI / 2 + a, false);
  sh.absarc(0, cy, R, Math.PI / 2 + a, Math.PI / 2 - a, true);
  sh.closePath();
  f.openings.push([s - c / 2 - 0.12, s + c / 2 + 0.12, yTop, yTop + rise + t + 0.05]);
  onFace(f, mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.17, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2, curveSegments: 20 }), material), s, 0, 0.0);
}
function bistroChair(x, z, rotY = 0) {
  const g = new THREE.Group();
  child(g, mesh(rbox(0.42, 0.04, 0.4, 0.015), M.bistro), 0, 0.46, 0);
  for (const y of [0.62, 0.74, 0.86]) child(g, mesh(rbox(0.42, 0.07, 0.025, 0.01), M.bistro), 0, y, -0.2);
  for (const sx of [-0.19, 0.19]) {
    child(g, mesh(rbox(0.03, 0.92, 0.03, 0.01), M.bistro), sx, 0.45, -0.19).rotation.x = -0.08;
    child(g, mesh(rbox(0.03, 0.48, 0.03, 0.01), M.bistro), sx, 0.23, 0.16).rotation.x = 0.14;
  }
  add(g, x, 0.08, z, rotY);
}
function litterBin(x, z, rotY = 0) {
  const g = new THREE.Group();
  child(g, mesh(rbox(0.55, 1.0, 0.45, 0.05), M.iron), 0, 0.5, 0);
  child(g, mesh(rbox(0.6, 0.06, 0.5, 0.02), M.iron), 0, 1.03, 0);
  child(g, mesh(rbox(0.16, 0.45, 0.02, 0.005), mat('#7b2d57', { roughness: 0.5 })), 0.13, 0.55, 0.235);
  add(g, x, 0.08, z, rotY);
}
// Tall modern column with an octagonal base, arm reaching over the road.
function modernLamp(x, z) {
  const g = new THREE.Group();
  child(g, mesh(new THREE.CylinderGeometry(0.2, 0.27, 1.1, 8), M.iron), 0, 0.55, 0);
  child(g, mesh(new THREE.CylinderGeometry(0.06, 0.09, 4.7, 10), M.iron), 0, 3.4, 0);
  child(g, mesh(rbox(0.06, 0.06, 0.95, 0.02), M.iron), 0, 5.7, 0.45);
  child(g, mesh(rbox(0.24, 0.1, 0.55, 0.03), M.iron), 0, 5.65, 0.95);
  child(g, mesh(rbox(0.2, 0.025, 0.47, 0.01), M.lampGlass, false), 0, 5.59, 0.95);

  nightLights.push({ light, max: 8 });
}
// Corbel bracket on the party line above the fascias, with a carved rosette.
function corbel(f, s, y) {
  faceBox(f, 0.3, 0.55, 0.42, M.corbel, s, y, 0.22, 0.04);
  faceBox(f, 0.36, 0.08, 0.48, M.corbel, s, y + 0.31, 0.24, 0.02);
  const ros = new THREE.Group();
  child(ros, mesh(new THREE.TorusGeometry(0.07, 0.025, 8, 16), M.corbel), 0, 0, 0);
  child(ros, mesh(new THREE.SphereGeometry(0.04, 10, 8), M.corbel), 0, 0, 0);
  onFace(f, ros, s, y + 0.05, 0.44);
}

// Small terrace shop with a painted timber front, brick upper floor and a mansard.
// parts: [type, s0, s1] with type 'window', 'glassDoor' or 'door'.
function shopTerrace({ x0, x1, shop, shopDeep, parts, lamps = false, seed = 1, zf = 2.5, zb = -3.5 }) {
  currentPlace = null;
  const ZF = zf, ZB = zb, d = Math.sign(ZF - ZB), w = x1 - x0, G1 = 3.3, TOP = 6.6, MAN = 8.6;
  const r = rng(seed);
  const zr = (a, b) => [Math.min(a, b), Math.max(a, b)];
  const poly = rect(x0, x1, ...zr(ZF, ZB));
  const f = d > 0 ? face([x0, ZF], [x1, ZF], { brick: C.stock }) : face([x1, ZF], [x0, ZF], { brick: C.stock });
  const fb = d > 0 ? face([x1, ZB], [x0, ZB], { brick: C.stock }) : face([x0, ZB], [x1, ZB], { brick: C.stock });
  const sm = mat(shop, { roughness: 0.5 }), deep = mat(shopDeep, { roughness: 0.55 });
  prism(poly, 0, 0.06, M.floor);
  prism(rect(x0, x1, ...zr(ZB, ZF - 1.5 * d)), 0, G1, M.interior);
  prism(rect(x0, x0 + 0.12, ...zr(ZF - 1.5 * d, ZF)), 0, G1, deep);
  prism(rect(x1 - 0.12, x1, ...zr(ZF - 1.5 * d, ZF)), 0, G1, deep);
  prism(poly, G1, TOP + 0.35, M.stockMortar);
  f.openings.push([0, w, -1, G1 + 0.2]);

  faceBox(f, w, 0.62, 0.24, sm, w / 2, 2.86, 0.13, 0.04);                       // fascia
  faceBox(f, w + 0.04, 0.12, 0.38, deep, w / 2, 3.22, 0.19, 0.03);
  for (const s of [0.1, w - 0.1]) {
    faceBox(f, 0.2, 2.55, 0.24, sm, s, 1.28, 0.1, 0.03);
    faceBox(f, 0.28, 0.14, 0.3, deep, s, 0.07, 0.12, 0.02);
  }
  for (const [type, a, b] of parts) {
    const pw = b - a, pm = (a + b) / 2;
    const y0 = type === 'window' ? 0.75 : 0.08;
    if (type === 'window') {
      faceBox(f, pw, 0.7, 0.18, sm, pm, 0.38, 0.05, 0.03);
      faceBox(f, pw - 0.3, 0.38, 0.04, deep, pm, 0.38, 0.15, 0.015);
    }
    if (type === 'door') {
      faceBox(f, pw, 2.45, 0.08, sm, pm, 1.25, 0.04, 0.02);
      for (const dy of [0.55, 1.5]) faceBox(f, pw - 0.24, 0.7, 0.04, deep, pm, dy, 0.09, 0.015);
      faceBox(f, 0.04, 0.2, 0.05, M.brass, pm + pw / 2 - 0.12, 1.2, 0.1, 0.01);
      continue;
    }
    onFace(f, mesh(new THREE.PlaneGeometry(pw, 2.5 - y0), M.shopGlass, false), pm, (y0 + 2.5) / 2, 0.02);
    const panes = Math.max(1, Math.round(pw / 0.6));
    for (let i = 0; i <= panes; i++) faceBox(f, 0.07, 2.5 - y0, 0.12, sm, a + pw * i / panes, (y0 + 2.5) / 2, 0.06, 0.02);
    for (const y of [y0, 2.05, 2.5]) faceBox(f, pw, 0.07, 0.12, sm, pm, y, 0.06, 0.02);
  }
  corbel(f, 0, 3.58);
  if (lamps) {
    for (const k of [0.2, 0.5, 0.8]) {
      const g = new THREE.Group();
      child(g, mesh(rbox(0.03, 0.03, 0.4, 0.01), M.iron), 0, 0.1, 0.2);
      child(g, mesh(new THREE.ConeGeometry(0.14, 0.14, 12, 1, true), mat('#5d6166', { roughness: 0.4, metalness: 0.4, side: THREE.DoubleSide })), 0, 0.02, 0.42);
      onFace(f, g, w * k, 3.35, 0.15);
    }
  }
  // Upper floor: stock brick, two tall sashes under gauged brick arches, white cornice.
  faceBox(f, w, 0.18, 0.12, M.paintWhite, w / 2, G1 + 0.09, 0.06, 0.02);
  for (const k of [0.3, 0.72]) sashWindow(f, w * k, 3.95, 0.72, 1.85, { panes: 'two', glass: r() > 0.5 ? M.windowGlass : M.windowDark });
  layBricks(f, G1 + 0.18, TOP);
  faceBox(f, w, 0.36, 0.3, M.paintWhite, w / 2, TOP + 0.17, 0.12, 0.04);
  mansard(x0, x1, TOP + 0.35, MAN, [(x0 + x1) / 2], seed, { zf: ZF, zb: ZB });
  for (const k of [0.3, 0.72]) {
    sashWindow(fb, w * k, 0.95, 0.72, 1.4, { glass: M.windowDark });
    sashWindow(fb, w * k, 3.95, 0.72, 1.6, { glass: r() > 0.5 ? M.windowGlass : M.windowDark });
  }
  layBricks(fb, 0, TOP + 0.35);
  return { poly, x0, x1, top: MAN, brick: C.stock };
}

// ── Mae + Harvey, all day café (414–416) ──────────────────────────────────────
// Two shop units under one deep black fascia on the end of a terrace: painted white brick
// above with segmental-arched sashes, a slate mansard with dormers, and a bare London
// stock brick flank on the corner. Blue folding bistro chairs line up outside 416.
function buildMaeHarvey() {
  currentPlace = 'mae';
  const X0 = -41, X1 = -33.5, ZF = 2.5, ZB = -3.5;
  const G1 = 3.4, TOP = 6.6, MAN = 8.6, FLANK = 9.1;
  const CH = 0.75;   // the corner door is set across a 45° cant at ground level
  const U = rect(X0, X1, ZB, ZF);
  const GF = [[X0, ZF], [X1 - CH, ZF], [X1, ZF - CH], [X1, ZB], [X0, ZB]];
  const fFront = face([X0, ZF], [X1, ZF], { brick: '#efede8' });
  const fSide = face([X1, ZF], [X1, ZB], { brick: C.stock });   // the corner flank, s from the front
  const fBack = face([X1, ZB], [X0, ZB], { brick: C.stock });
  const black = M.shopBlack, deep = M.shopBlackDeep;

  // ── Structure ──
  prism(GF, 0, 0.06, M.floor);
  prism([[X1 - CH, ZF], [X1, ZF], [X1, ZF - CH]], 0, 0.09, M.pavement);
  prism(rect(X0, X1, ZB, 0.9), 0, G1, M.interior);
  prism(rect(X0, X0 + 0.95, 0.9, ZF), 0, G1, M.stockMortar);   // 416A hallway
  prism(rect(X1 - 0.14, X1, 0.9, ZF - CH), 0, G1, M.stockMortar);
  prism(U, G1, TOP + 0.35, mat('#dcd8d0', { roughness: 0.95 }));
  prism(rect(X1 - 0.45, X1, ZB, ZF), TOP + 0.35, FLANK, M.stockMortar);
  prism(inset(rect(X1 - 0.45, X1, ZB, ZF), -0.05), FLANK, FLANK + 0.12, M.stone);
  // Mortar behind the flank bricks, stopping short of the canted doorway.
  faceBox(fSide, 6 - CH, FLANK, 0.04, M.stockMortar, (6 + CH) / 2, FLANK / 2, 0.0, 0.005);
  faceBox(fSide, CH, FLANK - G1, 0.04, M.stockMortar, CH / 2, (FLANK + G1) / 2, 0.0, 0.005);

  // ── Shopfront ──
  // Deep fascia box drawn in plan: it runs along the front, then cuts across the corner
  // at 45° above the canted door and dies into the flank wall.
  const FD = 0.6, FY0 = 2.55, FY1 = 3.4, K = Math.SQRT2 - 1;
  const fasciaEnd = X1 - CH + FD * K;                  // where the front face meets the cut
  const fasciaLen = fasciaEnd - (X0 - 0.15);
  prism([[X0 - 0.15, ZF + FD], [fasciaEnd, ZF + FD], [X1, ZF - CH + FD * Math.SQRT2], [X1, ZF - CH], [X1 - CH, ZF], [X0 - 0.15, ZF]], FY0, FY1, black);
  const L = FD + 0.07;
  prism([[X0 - 0.2, ZF + L], [X1 - CH + L * K, ZF + L], [X1, ZF - CH + L * Math.SQRT2], [X1, ZF - CH], [X1 - CH, ZF], [X0 - 0.2, ZF]], FY1, FY1 + 0.07, deep);
  const fasciaSign = (g, W, H) => {
    g.fillStyle = '#34404b'; g.fillRect(0, 0, W, H);
    const px = s => (s + 0.15) / fasciaLen * W;
    g.fillStyle = '#eef0f3'; g.textBaseline = 'middle';
    const font = n => `500 ${Math.round(H * n)}px "Barlow Semi Condensed", "Arial Narrow", sans-serif`;
    g.font = font(0.46); spacedText(g, 'MAE + HARVEY', px(1.55), H * 0.56, H * 0.035, px(2.5) - px(0.6));
    g.font = font(0.27); spacedText(g, 'ALL DAY CAFÉ', px(4.0), H * 0.6, H * 0.02);
    g.font = font(0.2); spacedText(g, '416', px(0.32), H * 0.66, 0); spacedText(g, '414', px(6.5), H * 0.42, 0);
  };
  add(canvasPlane(fasciaLen - 0.04, FY1 - FY0 - 0.04, fasciaSign, { glow: 0.35, res: 3072 }), (X0 - 0.15 + fasciaEnd) / 2, (FY0 + FY1) / 2, ZF + FD + 0.005);
  for (const s of [0.45, 1.55, 2.6, 4.1, 5.4, 6.45]) {
    const g = new THREE.Group();
    child(g, mesh(rbox(0.04, 0.04, 0.22, 0.01), M.iron), 0, 0, -0.11);
    child(g, mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.12, 10), M.iron), 0, 0.03, 0.02).rotation.x = 1.0;
    onFace(fFront, g, s, FY1 + 0.12, FD - 0.05);
  }

  const glazing = (s0, s1, { mullions = 1, door = false, glass = M.shopGlass } = {}) => {
    const w = s1 - s0, s = (s0 + s1) / 2, y0 = door ? 0.08 : 1.0, top = 2.5;
    onFace(fFront, mesh(new THREE.PlaneGeometry(w, top - y0), glass, false), s, (y0 + top) / 2, 0.02);
    faceBox(fFront, w + 0.08, 0.1, 0.16, black, s, top + 0.02, 0.06, 0.02);
    faceBox(fFront, w + 0.08, 0.09, 0.2, black, s, y0, 0.08, 0.02);
    faceBox(fFront, w, 0.08, 0.14, black, s, 2.08, 0.06, 0.02);
    for (let i = 0; i <= mullions; i++) faceBox(fFront, 0.09, top - y0, 0.16, black, s0 + w * i / mullions, (y0 + top) / 2, 0.07, 0.02);
    if (door) {
      faceBox(fFront, w - 0.1, 0.3, 0.05, black, s, 0.25, 0.05, 0.01);
      faceBox(fFront, 0.035, 0.45, 0.06, M.steel, s1 - 0.12, 1.15, 0.12, 0.01);
    }
  };
  fFront.openings.push([0, 7.5, 1.0, G1 + 0.1], [0.04, 0.95, -1, 2.6], [2.06, 2.9, -1, 2.6], [2.85, 3.15, -1, 2.6], [6.56, 7.5, -1, 2.6]);
  // 416A: the flat's black front door.
  faceBox(fFront, 0.72, 2.3, 0.08, black, 0.48, 1.15, 0.06, 0.02);
  for (const dy of [0.6, 1.6]) for (const dx of [-0.16, 0.16]) faceBox(fFront, 0.24, 0.7, 0.04, deep, 0.48 + dx, dy, 0.11, 0.015);
  faceBox(fFront, 0.22, 0.05, 0.03, M.brass, 0.48, 1.1, 0.12, 0.01);
  faceBox(fFront, 0.7, 0.18, 0.03, M.windowDark, 0.48, 2.42, 0.05, 0.01);
  for (const s of [0.07, 0.9, 2.09, 6.63]) faceBox(fFront, 0.12, 2.58, 0.18, black, s, 1.29, 0.07, 0.02);
  glazing(0.95, 2.05, { mullions: 2 });
  glazing(2.12, 2.85, { door: true });
  glazing(3.2, 6.57, { mullions: 2 });
  {
    // Corner door on the 45° cant, under the square fascia.
    const fCh = face([X1 - CH, ZF], [X1, ZF - CH]);
    const cl = fCh.len, cm = cl / 2;
    for (const s of [0.05, cl - 0.05]) faceBox(fCh, 0.1, 2.58, 0.16, black, s, 1.29, 0.04, 0.02);
    faceBox(fCh, cl, G1 - 2.5, 0.08, black, cm, (G1 + 2.5) / 2, 0.0, 0.02);
    onFace(fCh, mesh(new THREE.PlaneGeometry(cl - 0.2, 1.95), M.shopGlass, false), cm, 1.08, 0.0);
    faceBox(fCh, cl - 0.1, 0.09, 0.14, black, cm, 2.08, 0.04, 0.02);
    faceBox(fCh, cl - 0.2, 0.34, 0.03, M.windowDark, cm, 2.3, 0.01, 0.01);
    faceBox(fCh, cl - 0.1, 0.09, 0.14, black, cm, 2.52, 0.04, 0.02);
    faceBox(fCh, cl - 0.1, 0.09, 0.14, black, cm, 0.1, 0.04, 0.02);
    faceBox(fCh, cl - 0.2, 0.32, 0.05, black, cm, 0.3, 0.03, 0.01);
    faceBox(fCh, 0.035, 0.45, 0.06, M.steel, cl - 0.18, 1.15, 0.08, 0.01);
    faceBox(fCh, cl + 0.1, 0.12, 0.42, M.stone, cm, 0.06, 0.2, 0.02);
  }
  // Pilaster between the two units, its capital standing proud of the fascia, corbel above.
  faceBox(fFront, 0.3, 2.6, 0.3, black, 3.0, 1.3, 0.12, 0.03);
  faceBox(fFront, 0.42, 0.22, 0.4, black, 3.0, 0.11, 0.16, 0.03);
  for (const y of [0.75, 1.75]) faceBox(fFront, 0.16, 0.7, 0.04, deep, 3.0, y, 0.28, 0.015);
  faceBox(fFront, 0.44, 0.95, 0.56, black, 3.0, 2.96, 0.34, 0.04);
  faceBox(fFront, 0.26, 0.55, 0.04, deep, 3.0, 2.96, 0.63, 0.015);
  corbel(fFront, 3.0, 3.72);
  corbel(fFront, 0, 3.66);
  layBricks(fFront, 0, 1.0, { color: ['#b07a55', '#c49a6a', '#a8644a', '#cfae7c', '#9c7a5c'] });

  // ── Upper floor: painted brick, four tall sashes with segmental arches ──
  for (const [s, seed] of [[1.3, 1], [2.75, 2], [4.5, 3], [6.3, 4]]) {
    sashWindow(fFront, s, 4.0, 0.8, 1.95, { lintel: false, panes: 'two', glass: rng(seed + 30)() > 0.4 ? M.windowGlass : M.windowDark });
    archHead(fFront, s, 5.95, 0.8, M.paintWhite);
  }
  {
    const p = facePoint(fFront, 3.65, (G1 + 0.5 + TOP + 0.2) / 2, 0.2);
    add(mesh(new THREE.CylinderGeometry(0.05, 0.05, TOP + 0.2 - G1 - 0.5, 8), M.iron), p.x, p.y, p.z);
    faceBox(fFront, 0.22, 0.22, 0.24, M.iron, 3.65, TOP + 0.15, 0.2, 0.03);
  }
  layBricks(fFront, G1, TOP);
  faceBox(fFront, 7.05, 0.36, 0.3, M.paintWhite, 3.525, TOP + 0.17, 0.12, 0.04);
  faceBox(fFront, 7.05, 0.1, 0.18, black, 3.525, TOP + 0.38, 0.16, 0.03);
  mansard(X0, X1 - 0.45, TOP + 0.35, MAN, [X0 + 1.4, X0 + 3.55, X0 + 5.7], 21);

  // ── Corner flank: bare stock brick, drainpipe and air-con units ──
  fSide.openings.push([0, CH + 0.05, -1, G1 + 0.1]);
  layBricks(fSide, 0, FLANK);
  layBricks(face([X1 - 0.45, ZF], [X1, ZF], { brick: C.stock }), TOP + 0.35, FLANK);
  layBricks(face([X1 - 0.45, ZB], [X1 - 0.45, ZF], { brick: C.stock }), MAN - 0.3, FLANK);
  chimney(X1 - 0.45, -2.2, FLANK, { color: C.stock, pots: 2 });
  {
    const p = facePoint(fSide, 1.05, FLANK / 2, 0.22);   // behind the canted corner, on solid wall
    add(mesh(new THREE.CylinderGeometry(0.05, 0.05, FLANK - 0.2, 8), M.iron), p.x, p.y, p.z);
    for (const y of [4.0, 5.3]) {
      faceBox(fSide, 0.85, 0.6, 0.34, mat('#e8e8e4', { roughness: 0.5 }), 1.95, y, 0.32, 0.04);
      const fan = new THREE.Group();
      child(fan, mesh(new THREE.TorusGeometry(0.19, 0.03, 8, 20), M.lead), 0, 0, 0);
      onFace(fSide, fan, 2.07, y, 0.5);
    }
  }

  // ── Back ──
  for (const s of [1.6, 3.8, 6.0]) sashWindow(fBack, s, 3.95, 0.8, 1.7, { glass: rng(s * 10)() > 0.5 ? M.windowGlass : M.windowDark });
  sashWindow(fBack, 5.5, 0.95, 0.9, 1.4, { glass: M.windowDark });
  fBack.openings.push([1.1, 2.1, -1, 2.45]);
  faceBox(fBack, 0.9, 2.0, 0.1, black, 1.6, 1.0, 0.0, 0.03);
  layBricks(fBack, 0, TOP + 0.35);

  // ── Inside: coffee counter in 416, white tables and oak chairs in 414 ──
  add(mesh(rbox(1.5, 1.0, 0.5, 0.04), M.oak), X0 + 1.55, 0.5, 1.25);
  add(mesh(rbox(1.6, 0.05, 0.6, 0.02), M.paintWhite), X0 + 1.55, 1.02, 1.25);
  add(mesh(rbox(0.55, 0.38, 0.38, 0.04), M.steel), X0 + 1.3, 1.24, 1.2);
  for (const dx of [3.9, 5.0, 6.1]) {
    add(mesh(rbox(0.7, 0.05, 0.6, 0.02), M.paintWhite), X0 + dx, 0.78, 1.6);
    add(mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.74, 6), M.iron), X0 + dx, 0.4, 1.6);
    for (const side of [-1, 1]) {
      add(mesh(rbox(0.36, 0.04, 0.36, 0.015), M.oak), X0 + dx + side * 0.48, 0.48, 1.6);
      add(mesh(rbox(0.04, 0.4, 0.36, 0.015), M.oak), X0 + dx + side * 0.66, 0.7, 1.6);
    }
  }
  for (const dx of [1.5, 4.4, 5.8]) {
    add(mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.5, 4), M.iron, false), X0 + dx, G1 - 0.25, 1.5);
    add(mesh(new THREE.SphereGeometry(0.13, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.7), M.pendant, false), X0 + dx, G1 - 0.6, 1.5);
  }
  for (const dx of [1.6, 5.0]) {
    const l = new THREE.PointLight('#ffc27a', 0, 5.5, 1.4);
    l.position.set(X0 + dx, 2.3, 1.7); world.add(l);
    nightLights.push({ light: l, max: 6 });
  }

  // ── Outside ──
  for (const dx of [1.0, 1.48, 1.96, 2.44]) bistroChair(X0 + dx, ZF + 0.32, 0);
  litterBin(X1 - 1.1, 4.95);
  modernLamp(X1 + 0.55, 5.05);
  currentPlace = null;
  return { poly: GF, x0: X0, x1: X1, top: MAN, brick: C.stock };
}

// ── Donia, upstairs ────────────────────────────────────────────────────────────
// Donia lives on the first floor, up on a timber deck that overhangs the pavement on blue
// steel. Underneath are deliberately plain grey shop units, so Donia reads on its own.
// Dark London brick with three green-framed bays: the left one under a green-painted brick
// arch with frosted panes, the other two with "Donia" awnings pulled out. Green painted-brick
// stallriser, galvanised lanterns, a green gutter board, and a slate roof with two white
// chimneys and one brick one. Colours sampled from the photos in refs/donia/.
Object.assign(M, {
  doniaGreen: mat('#2b3a26', { roughness: 0.38, clearcoat: 0.25, clearcoatRoughness: 0.4 }),
  doniaPaint: mat('#4c5a3f', { roughness: 0.7 }),
