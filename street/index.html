  doniaAwning: addMotion(mat('#4a5a3e', { roughness: 0.75, side: THREE.DoubleSide }), 'doniaAwning', { world: `wOff.y += sin(uTime * 1.8 + ip.x * 1.3 + ip.z * 0.9) * 0.012 * gust;` }),
  doniaSlate: mat('#4a4846', { roughness: 0.85 }),
  doniaChimney: mat('#eadfc0', { roughness: 0.85 }),
  doniaMortar: mat('#55493c', { roughness: 0.95 }),
  doniaInterior: mat('#6e5a44', { emissive: '#ffb45c', emissiveIntensity: 0 }),
  frosted: mat('#e8eae4', { roughness: 0.35, transparent: true, opacity: 0.88 }),
  steelBlue: mat('#6b93ba', { roughness: 0.45, metalness: 0.35 }),
  deckWood: mat('#6b563f', { roughness: 0.8 }),
  deckGroove: mat('#3e3125', { roughness: 0.9 }),
  handrail: mat('#9a7a5c', { roughness: 0.6 }),
  railGlass: new THREE.MeshStandardMaterial({ color: '#cfe0e6', roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.22, depthWrite: false, side: THREE.DoubleSide }),
  galv: mat('#8d9295', { roughness: 0.4, metalness: 0.6 }),
  plainGrey: mat('#9a9c9e', { roughness: 0.7 }),
  plainGreyDark: mat('#6c7073', { roughness: 0.6 }),
  plainGreyLight: mat('#b8babc', { roughness: 0.7 }),
  plainInterior: mat('#d6d6d3', { emissive: '#ffd9a8', emissiveIntensity: 0 }),
});
M.plainGlass = M.shopGlass.clone();

// Slate tiles drawn on canvas: courses up the slope, staggered joints, a shadow under each
// course and a little tone variation per slate. Used as colour and bump on the roofs.
const slateTexture = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const r = rng(404), COURSES = 4, PER = 3, cw = c.width / COURSES, th = c.height / PER;
  g.fillStyle = '#4a4a4a'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < COURSES; i++) {
    const off = (i % 2) * th / 2;
    for (let j = -1; j <= PER; j++) {
      const y0 = j * th + off, v = 200 + Math.floor(r() * 40);
      const grad = g.createLinearGradient(i * cw, 0, (i + 1) * cw, 0);
      grad.addColorStop(0, `rgb(${v - 70},${v - 70},${v - 68})`);   // shadow from the course above
      grad.addColorStop(0.18, `rgb(${v},${v},${v + 2})`);
      grad.addColorStop(1, `rgb(${v - 12},${v - 12},${v - 10})`);
      g.fillStyle = grad;
      g.fillRect(i * cw + 2, y0 + 3, cw - 4, th - 6);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
})();
for (const [m, color] of [[M.doniaSlate, '#6d6a67'], [M.slate, '#646a70']]) {
  m.map = slateTexture; m.bumpMap = slateTexture; m.bumpScale = 1.6;
  m.color.set(color); m.needsUpdate = true;
}

function buildDonia() {
  const X0 = -6, X1 = 5.5, ZF = 2.5, ZB = -3.5, W = X1 - X0;
  // Donia's level sits a storey up (LIFT), over a plain brick floor above the grey shops.
  const LIFT = 3.0, G1 = 3.2, DECK = 3.45 + LIFT, SILL = 4.35 + LIFT, TR = 5.5 + LIFT, HEAD = 6.0 + LIFT, EAVES = 6.6 + LIFT, RIDGE = 7.75 + LIFT, OVER = 1.75;
  const brickMix = ['#7a6650', '#8a735a', '#73604c', '#94805f', '#685543'];
  const greenBrick = ['#4c5a3f', '#55644a', '#45533a'];
  const script = n => `${n}px "Pinyon Script", "Snell Roundhand", cursive`;

  // ── Ground floor: plain grey units, kept quiet ──
  currentPlace = null;
  const fG = face([X0, ZF], [X1, ZF]);
  prism(rect(X0, X1, ZB, ZF), 0, 0.06, M.floor);
  prism(rect(X0, X1, ZB, 1.0), 0, G1, M.plainInterior);
  for (const [a, b] of [[0, 0.3], [3.7, 4.0], [7.4, 7.7], [11.2, W]]) prism(rect(X0 + a, X0 + b, 1.0, ZF), 0, G1, M.plainGrey);
  faceBox(fG, W, 0.66, 0.1, M.plainGrey, W / 2, 2.87, 0.04, 0.02);
  for (const [a, b] of [[0.3, 3.7], [4.0, 7.4], [7.7, 11.2]]) {
    const w = b - a, m = (a + b) / 2, d = b - 0.95;
    faceBox(fG, w - 0.1, 0.42, 0.06, M.plainGreyLight, m, 2.87, 0.1, 0.02);          // blank fascia
    faceBox(fG, d - a, 0.45, 0.12, M.plainGrey, (a + d) / 2, 0.23, 0.06, 0.02);       // stallriser
    onFace(fG, mesh(new THREE.PlaneGeometry(d - a - 0.08, 2.0), M.plainGlass, false), (a + d) / 2, 1.48, 0.02);
    onFace(fG, mesh(new THREE.PlaneGeometry(0.78, 2.45), M.plainGlass, false), b - 0.48, 1.27, 0.02);
    for (const s of [a + 0.04, d, b - 0.04]) faceBox(fG, 0.08, 2.5, 0.1, M.plainGreyDark, s, 1.25, 0.05, 0.02);
    faceBox(fG, w, 0.08, 0.1, M.plainGreyDark, m, 2.5, 0.05, 0.02);
    faceBox(fG, d - a, 0.06, 0.1, M.plainGreyDark, (a + d) / 2, 0.47, 0.05, 0.02);
  }
  const fGB = face([X1, ZB], [X0, ZB]);
  faceBox(fGB, W, G1, 0.04, M.plainGrey, W / 2, G1 / 2, 0.0, 0.01);
  for (const s of [2.0, 6.0, 9.5]) faceBox(fGB, 0.9, 2.1, 0.06, M.plainGreyDark, s, 1.05, 0.03, 0.02);
  faceBox(face([X1, ZF], [X1, ZB]), 6, G1, 0.04, M.plainGrey, 3, G1 / 2, 0.0, 0.01);

  // ── Floor slab and the deck overhanging the pavement ──
  currentPlace = 'donia';
  prism(rect(X0, X1, ZB, ZF), G1, G1 + 0.25, M.plainGreyDark);
  // The plain floor between the shops and Donia: London brick, a row of sashes front and back.
  {
    const M0 = G1 + 0.25, M1 = DECK - 0.25;
    prism(rect(X0, X1, ZB, ZF), M0, M1, M.doniaMortar);
    prism(rect(X0, X1, ZB, ZF), M1, DECK, M.plainGreyDark);
    const fM = face([X0, ZF], [X1, ZF], { brick: brickMix[0] }), fMB = face([X1, ZB], [X0, ZB], { brick: brickMix[0] });
    for (const s of [1.3, 2.7, 4.9, 6.3, 8.4, 9.8]) sashWindow(fM, s, M0 + 0.5, 0.85, 1.55, { panes: 'two', glass: rng(s * 13)() > 0.5 ? M.windowGlass : M.windowDark });
    for (const s of [2.0, 5.5, 9.0]) sashWindow(fMB, s, M0 + 0.5, 0.9, 1.5, { glass: M.windowDark, panes: 'two' });
    layBricks(fM, M0, M1, { color: brickMix });
    layBricks(fMB, M0, M1, { color: brickMix });
  }
  add(mesh(rbox(W, 0.2, OVER, 0.02), M.deckWood), (X0 + X1) / 2, DECK - 0.1, ZF + OVER / 2);
  {
    const grooves = [], bolts = [], lights = [];
    for (let x = X0 + 0.1; x < X1; x += 0.2) grooves.push(new THREE.BoxGeometry(0.02, 0.01, OVER - 0.05).translate(x, DECK + 0.003, ZF + OVER / 2));
    for (let x = X0 + 0.15; x < X1; x += 0.3) for (const y of [DECK - 0.12, DECK - 0.34]) bolts.push(new THREE.SphereGeometry(0.025, 6, 4).translate(x, y, ZF + OVER + 0.14));
    for (let x = X0 + 0.7; x < X1; x += 1.4) lights.push(new THREE.CylinderGeometry(0.06, 0.06, 0.03, 10).translate(x, DECK - 0.47, ZF + OVER + 0.02));
    world.add(mesh(mergeGeometries(grooves), M.deckGroove, false));
    world.add(mesh(mergeGeometries(bolts), M.steelBlue));
    world.add(mesh(mergeGeometries(lights), M.lampGlass, false));
  }
  add(mesh(rbox(W, 0.44, 0.16, 0.03), M.steelBlue), (X0 + X1) / 2, DECK - 0.23, ZF + OVER + 0.06);
  // Cantilever joists and diagonal struts back to the wall.
  const dz = OVER - 0.15, dy = 0.95, strut = Math.hypot(dz, dy);
  for (let x = X0 + 0.5; x < X1; x += 2.3) {
    add(mesh(rbox(0.12, 0.16, OVER, 0.02), M.steelBlue), x, DECK - 0.28, ZF + OVER / 2);
    const st = add(mesh(rbox(0.1, 0.1, strut, 0.02), M.steelBlue), x, DECK - 0.3 - dy / 2, ZF + dz / 2);
    st.rotation.x = -Math.asin(dy / strut);
  }
  // Railing: black steel posts with bolt plates, close vertical bars, black top and bottom rails.
  {
    const zr = ZF + OVER - 0.06;
    const railBlack = mat('#1b1a18', { roughness: 0.45, metalness: 0.4 });
    const posts = [];
    for (let x = X0 + 0.08; x <= X1 - 0.05; x += 2.3) posts.push(x);
    if (X1 - 0.08 - posts.at(-1) > 0.5) posts.push(X1 - 0.08);
    for (const x of posts) {
      add(mesh(rbox(0.12, 1.2, 0.14, 0.02), railBlack), x, DECK + 0.6, zr);
      add(mesh(rbox(0.2, 0.04, 0.2, 0.01), railBlack), x, DECK + 0.02, zr);
      add(mesh(rbox(0.16, 0.2, 0.03, 0.01), railBlack), x, DECK + 1.02, zr + 0.08);   // bolt plate
      for (const y of [0.97, 1.07]) add(mesh(new THREE.SphereGeometry(0.022, 8, 6), M.steel), x, DECK + y, zr + 0.1);
    }
    for (const z of [ZF + 0.3, ZF + 0.9]) add(mesh(rbox(0.12, 1.2, 0.14, 0.02), railBlack), X0 + 0.08, DECK + 0.6, z);
    add(mesh(rbox(W, 0.07, 0.1, 0.02), railBlack), (X0 + X1) / 2, DECK + 1.2, zr);
    add(mesh(rbox(W, 0.05, 0.06, 0.015), railBlack), (X0 + X1) / 2, DECK + 0.12, zr);
    add(mesh(rbox(0.1, 0.07, OVER, 0.02), railBlack), X0 + 0.08, DECK + 1.2, ZF + OVER / 2);
    add(mesh(rbox(0.06, 0.05, OVER, 0.015), railBlack), X0 + 0.08, DECK + 0.12, ZF + OVER / 2);
    const barGeo = [];
    for (let x = X0 + 0.2; x < X1 - 0.08; x += 0.12) {
      if (posts.some(p => Math.abs(p - x) < 0.08)) continue;
      barGeo.push(new THREE.CylinderGeometry(0.014, 0.014, 1.06, 5).translate(x, DECK + 0.66, zr));
    }
    for (let z = ZF + 0.12; z < ZF + OVER - 0.1; z += 0.12) {
      barGeo.push(new THREE.CylinderGeometry(0.014, 0.014, 1.06, 5).translate(X0 + 0.08, DECK + 0.66, z));
    }
    world.add(mesh(mergeGeometries(barGeo), railBlack));
    // Twin floodlight on the middle post.
    const fl = new THREE.Group();
    for (const dx of [-0.09, 0.09]) {
      child(fl, mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.1, 12), M.galv), dx, 0, 0.05).rotation.x = Math.PI / 2;
      child(fl, mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.01, 12), M.lampGlass, false), dx, 0, 0.105).rotation.x = Math.PI / 2;
    }
    add(fl, posts[Math.floor(posts.length / 2)], DECK + 0.25, zr + 0.06);
  }

  // ── First floor: Donia ──
  const f = face([X0, ZF], [X1, ZF], { brick: brickMix[0] });
  const bays = [{ s0: 0.6, s1: 3.4, arch: true }, { s0: 4.1, s1: 7.1, door: true }, { s0: 7.8, s1: 10.4, door: true }];
  prism(rect(X0, X1, ZB, 1.1), DECK, EAVES, M.doniaInterior);
  prism(rect(X0, X1, 1.1, ZF), HEAD, EAVES, M.doniaMortar);
  for (const [a, b] of [[0, 0.6], [3.4, 4.1], [7.1, 7.8], [10.4, W]]) prism(rect(X0 + a, X0 + b, 1.1, ZF), DECK, HEAD, M.doniaMortar);
  prism(rect(X0, X1, 1.1, ZF), DECK, DECK + 0.03, M.darkWood);
  for (const bay of bays) {
    const { s0, s1, arch, door } = bay;
    const ds = door ? s1 - 0.95 : s1;                       // door from ds to s1
    f.openings.push([s0 - 0.02, s1 + 0.02, DECK - 1, HEAD + 0.12]);
    prism(rect(X0 + s0, X0 + ds, 1.1, ZF), DECK, SILL, M.doniaMortar);
    layBricks(face([X0 + s0, ZF], [X0 + ds, ZF], { brick: greenBrick[0] }), DECK, SILL - 0.08, { color: greenBrick });
    faceBox(f, ds - s0 + 0.1, 0.09, 0.24, mat('#9c9789', { roughness: 0.8 }), (s0 + ds) / 2, SILL - 0.04, 0.1, 0.02);
    // Window part: glass, frame, small panes, transom.
    const ww = ds - s0;
    onFace(f, mesh(new THREE.PlaneGeometry(ww - 0.1, HEAD - SILL), M.shopGlass, false), (s0 + ds) / 2, (SILL + HEAD) / 2, 0.0);
    faceBox(f, ww, 0.1, 0.12, M.doniaGreen, (s0 + ds) / 2, HEAD - 0.05, 0.04, 0.02);
    faceBox(f, ww, 0.08, 0.12, M.doniaGreen, (s0 + ds) / 2, SILL + 0.04, 0.04, 0.02);
    faceBox(f, ww, 0.07, 0.1, M.doniaGreen, (s0 + ds) / 2, TR, 0.04, 0.02);
    faceBox(f, ww, 0.035, 0.07, M.doniaGreen, (s0 + ds) / 2, (SILL + TR) / 2, 0.04, 0.01);
    const panes = Math.max(2, Math.round(ww / 0.4));
    for (let i = 0; i <= panes; i++) {
      const s = s0 + ww * i / panes, edge = i === 0 || i === panes;
      faceBox(f, edge ? 0.1 : 0.035, HEAD - SILL, edge ? 0.12 : 0.07, M.doniaGreen, s, (SILL + HEAD) / 2, 0.04, 0.01);
    }
    if (door) {
      onFace(f, mesh(new THREE.PlaneGeometry(0.85, HEAD - DECK - 0.5), M.shopGlass, false), ds + 0.475, (DECK + 0.45 + HEAD) / 2, 0.0);
      faceBox(f, 0.85, 0.45, 0.08, M.doniaGreen, ds + 0.475, DECK + 0.23, 0.03, 0.02);
      faceBox(f, 0.85, 0.07, 0.1, M.doniaGreen, ds + 0.475, TR, 0.04, 0.02);
      faceBox(f, 0.85, 0.035, 0.07, M.doniaGreen, ds + 0.475, (DECK + 0.45 + TR) / 2, 0.04, 0.01);
      faceBox(f, 0.035, TR - DECK - 0.45, 0.07, M.doniaGreen, ds + 0.475, (DECK + 0.45 + TR) / 2, 0.04, 0.01);
      for (const s of [ds + 0.05, s1 - 0.05]) faceBox(f, 0.1, HEAD - DECK, 0.12, M.doniaGreen, s, (DECK + HEAD) / 2, 0.04, 0.02);
      faceBox(f, 0.85, 0.1, 0.12, M.doniaGreen, ds + 0.475, HEAD - 0.05, 0.04, 0.02);
      faceBox(f, 0.03, 0.22, 0.05, M.brass, ds + 0.15, 4.6 + LIFT, 0.1, 0.01);
    }
    if (arch) {
      // Green-painted brick arch, and frosted lower panes lettered D-o-n-i-a.
      archHead(f, (s0 + s1) / 2, HEAD, ww - 0.1, M.doniaPaint, { rise: 0.42, t: 0.34 });
      onFace(f, mesh(new THREE.PlaneGeometry(ww - 0.12, (TR - SILL) / 2 - 0.05), M.frosted, false), (s0 + ds) / 2, SILL + (TR - SILL) / 4 + 0.04, 0.015);
      onFace(f, canvasPlane(ww - 0.2, 0.42, (g, Wc, Hc) => {
        g.fillStyle = '#6d726a'; g.textBaseline = 'middle';
        g.font = script(Math.round(Hc * 0.62));
        // One letter per pane, centred across the window.
        const letters = [...'Donia'], first = Math.floor((panes - letters.length) / 2);
        g.textAlign = 'center';
        letters.forEach((ch, i) => g.fillText(ch, (first + i + 0.5) / panes * Wc, Hc * 0.55));
      }, { transparent: true, glow: 0 }), (s0 + ds) / 2, SILL + (TR - SILL) / 4 + 0.04, 0.025);
    } else {
      faceBox(f, s1 - s0 + 0.2, 0.12, 0.08, M.iron, (s0 + s1) / 2, HEAD + 0.06, 0.03, 0.02);
    }
  }
  layBricks(f, DECK, EAVES - 0.1, { color: brickMix });

  // Awnings over the middle and right bays, pulled out.
  const awningTop = (g, Wc, Hc) => {
    g.fillStyle = '#efe8d6'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = script(Math.round(Hc * 0.78)); g.fillText('Donia', Wc / 2, Hc * 0.55);
  };
  const awningValance = (g, Wc, Hc) => {
    g.fillStyle = '#4a5a3e'; g.fillRect(0, 0, Wc, Hc);
    g.fillStyle = '#efe8d6'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = script(Math.round(Hc * 0.62)); g.fillText('Donia', Wc / 2, Hc * 0.55);
  };
  for (const { s0, s1, door } of bays) {
    if (!door) continue;
    const w = s1 - s0 + 0.3, s = (s0 + s1) / 2, top = EAVES - 0.22, P = 1.25, drop = 0.55;
    const len = Math.hypot(P, drop), tilt = Math.atan2(drop, P);
    const g = new THREE.Group();
    // The canvas and its lettering share a tilted group (static meshes get merged, so
    // the lettering can't hang off the canvas mesh itself).
    const slope = child(g, new THREE.Group(), 0, top - drop / 2, P / 2);
    slope.rotation.x = tilt;
    child(slope, mesh(rbox(w, 0.035, len, 0.012), M.doniaAwning), 0, 0, 0);
    const text = child(slope, canvasPlane(w * 0.72, len * 0.72, awningTop, { transparent: true, glow: 0.15 }), 0, 0.022, 0);
    text.rotation.x = -Math.PI / 2;
    child(g, mesh(rbox(w + 0.06, 0.14, 0.18, 0.05), M.galv), 0, top + 0.03, 0.09);
    child(g, mesh(new THREE.CylinderGeometry(0.045, 0.045, w + 0.08, 10), M.galv), 0, top - drop, P).rotation.z = Math.PI / 2;
    child(g, mesh(rbox(w, 0.3, 0.025, 0.008), M.doniaAwning), 0, top - drop - 0.17, P + 0.02);
    child(g, canvasPlane(w * 0.35, 0.26, awningValance, { glow: 0.15 }), 0, top - drop - 0.17, P + 0.035);
    for (const sd of [-1, 1]) child(g, mesh(rbox(0.1, 0.22, 0.2, 0.03), M.galv), sd * (w / 2 + 0.02), top, 0.12);
    onFace(f, g, s, 0, 0.0);
  }

  // Gutter board, cream blocks, downpipe, lanterns and the menu case.
  faceBox(f, W + 0.2, 0.2, 0.36, M.doniaGutter, W / 2, EAVES + 0.02, 0.18, 0.04);
  for (const s of [1.2, 3.75, 6.4, 9.0]) faceBox(f, 0.16, 0.12, 0.12, M.doniaChimney, s, EAVES - 0.2, 0.08, 0.02);
  {
    const p = facePoint(f, 0.3, (DECK + EAVES) / 2, 0.16);
    add(mesh(new THREE.CylinderGeometry(0.05, 0.05, EAVES - DECK, 8), M.plainGreyDark), p.x, p.y, p.z);
  }
  for (const s of [3.75, 7.45, 10.9]) {
    const g = new THREE.Group();
    child(g, mesh(rbox(0.04, 0.04, 0.3, 0.01), M.galv), 0, 0.14, 0.15);
    child(g, mesh(new THREE.ConeGeometry(0.17, 0.12, 14, 1, true), M.galv), 0, 0.1, 0.32);
    child(g, mesh(new THREE.SphereGeometry(0.09, 12, 10), M.lampGlass, false), 0, 0.0, 0.32);
    child(g, mesh(new THREE.TorusGeometry(0.09, 0.012, 6, 14), M.galv), 0, 0.0, 0.32).rotation.x = Math.PI / 2;
    onFace(f, g, s, 5.65 + LIFT, 0.06);
  }
  faceBox(f, 0.62, 1.05, 0.1, M.doniaGreen, 10.9, 4.85 + LIFT, 0.08, 0.02);
  onFace(f, canvasPlane(0.5, 0.9, (g, Wc, Hc) => {
    g.fillStyle = '#f2ecdc'; g.fillRect(0, 0, Wc, Hc);
    g.fillStyle = '#3a3f35'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = script(Math.round(Wc * 0.22)); g.fillText('Donia', Wc / 2, Hc * 0.1);
    g.fillStyle = '#b9b3a3';
    for (let i = 0; i < 10; i++) g.fillRect(Wc * 0.18, Hc * (0.22 + i * 0.065), Wc * (0.5 + (i % 3) * 0.1), Hc * 0.012);
  }, { glow: 0.3 }), 10.9, 4.85 + LIFT, 0.135);

  // ── Roof, gables and chimneys ──
  const prof = [[ZF + 0.35, EAVES], [-0.5, RIDGE], [ZB - 0.2, EAVES]];
  const roof = new THREE.ExtrudeGeometry(new THREE.Shape(prof.map(([z, y]) => new THREE.Vector2(-z, y))), { depth: W, bevelEnabled: false });
  roof.rotateY(Math.PI / 2).translate(X0, 0, 0);
  world.add(mesh(roof, M.doniaSlate));
  const gable = [[ZF, EAVES], [-0.5, RIDGE - 0.15], [ZB, EAVES]];
  for (const x of [X0, X1 - 0.25]) {
    const geo = new THREE.ExtrudeGeometry(new THREE.Shape(gable.map(([z, y]) => new THREE.Vector2(-z, y))), { depth: 0.25, bevelEnabled: false });
    geo.rotateY(Math.PI / 2).translate(x, 0, 0);
    world.add(mesh(geo, mat('#7a6650', { roughness: 0.9 })));
  }
  for (const [x, m] of [[X0 + 2.0, M.doniaChimney], [X0 + 6.0, M.doniaChimney], [X0 + 10.6, mat('#8a7058', { roughness: 0.9 })]]) {
    add(mesh(rbox(1.1, 1.5, 0.8, 0.05), m), x, 7.55 + LIFT, 1.0);
    add(mesh(rbox(1.2, 0.1, 0.9, 0.03), M.stone), x, 8.33 + LIFT, 1.0);
    add(mesh(rbox(1.24, 0.08, 0.94, 0.02), M.lead), x, 7.13 + LIFT, 1.0);
  }

  // ── Back and the exposed right-hand end ──
  const fB = face([X1, ZB], [X0, ZB], { brick: brickMix[0] });
  faceBox(fB, W, EAVES - DECK, 0.04, M.doniaMortar, W / 2, (DECK + EAVES) / 2, 0.0, 0.01);
  for (const s of [2.0, 5.5, 9.0]) sashWindow(fB, s, 4.1 + LIFT, 0.9, 1.5, { glass: M.windowDark, frame: M.doniaGreen, panes: 'two' });
  layBricks(fB, DECK, EAVES, { color: brickMix });
  const fR = face([X1, ZF], [X1, ZB], { brick: brickMix[0] });
  faceBox(fR, 6, EAVES - DECK, 0.04, M.doniaMortar, 3, (DECK + EAVES) / 2, 0.0, 0.01);
  layBricks(fR, DECK, EAVES, { color: brickMix });

  // ── Inside: green banquette, small tables, warm cove light, pendants ──
  add(mesh(rbox(W - 1.2, 0.45, 0.42, 0.04), mat('#3f5a3c', { roughness: 0.7 })), (X0 + X1) / 2, DECK + 0.23, 1.32);
  add(mesh(rbox(W - 1.2, 0.5, 0.12, 0.04), mat('#3f5a3c', { roughness: 0.7 })), (X0 + X1) / 2, DECK + 0.65, 1.16);
  add(mesh(rbox(W - 1.2, 0.04, 0.05, 0.01), M.pendant, false), (X0 + X1) / 2, DECK + 1.05, 1.13);
  for (let x = X0 + 1.2; x < X1 - 0.8; x += 1.3) {
    add(mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.04, 16), M.paintWhite), x, DECK + 0.76, 1.85);
    add(mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.74, 6), M.brass), x, DECK + 0.38, 1.85);
    add(mesh(new THREE.SphereGeometry(0.1, 12, 10), M.pendant, false), x, HEAD - 0.35, 1.9);
  }
  for (const x of [X0 + 2.0, X0 + 5.6, X0 + 9.1]) {
    const l = new THREE.PointLight('#ffb35e', 0, 5.5, 1.4);
    l.position.set(x, 5.3 + LIFT, 1.9); world.add(l);
    nightLights.push({ light: l, max: 6 });
  }
  currentPlace = null;
  return { poly: rect(X0, X1, ZB, ZF), x0: X0, x1: X1, top: EAVES, brick: brickMix[0] };
}

// ── The station square and Hausu ───────────────────────────────────────────────
// A Victorian station across the road from Mae + Harvey: a central block and two wings
// round a paved square, yellow stock brick with grey through it, sandstone bands and
// arches, round-headed windows, modillion cornices and pale tiled hipped roofs. The
// right-hand wing (seen from the road) is Hausu, on the ground and first floors, wrapping
// the corner from the square to the street: only Hausu gets the green doors, green window
// frames and green cast-iron balconettes. Colours from the photos in refs/hausu/.
const STATION_BRICK = ['#cbb68c', '#bfae8a', '#d2c29c', '#aaa08a', '#c6ab80', '#b9a789'];
const PLINTH_BRICK = ['#4a4f5a', '#565a63', '#3f434c'];

// Brick drawn on canvas for the station's plain walls (backs and ends), so the
// hero faces can have real bricks without paying for them everywhere.
const flatBrickTexture = (() => {
  const c = document.createElement('canvas'); c.width = 448; c.height = 400;
  const g = c.getContext('2d');
  const r = rng(808);
  g.fillStyle = '#9f9377'; g.fillRect(0, 0, 448, 400);
  for (let row = 0; row < 4; row++) {
    const off = (row % 2) * 112;
    for (let k = -1; k < 3; k++) {
      g.fillStyle = STATION_BRICK[Math.floor(r() * STATION_BRICK.length)];
      g.fillRect(off + k * 224 + 6, row * 100 + 6, 212, 88);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1 / 1.12, 1);   // extruded walls get UVs in world units
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
})();
// Green cast-iron balconette pattern: rings with a lily in each, on a transparent canvas.
const balconetteTexture = (() => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.strokeStyle = '#2f7d5e'; g.fillStyle = '#2f7d5e'; g.lineWidth = 9; g.lineCap = 'round';
  g.fillRect(0, 0, 512, 10); g.fillRect(0, 118, 512, 10);
  for (let i = 0; i < 4; i++) {
    const cx = 64 + i * 128;
    g.beginPath(); g.arc(cx, 64, 44, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(cx, 26); g.lineTo(cx, 102); g.stroke();
    g.beginPath(); g.moveTo(cx - 24, 50); g.quadraticCurveTo(cx, 80, cx + 24, 50); g.stroke();
    g.beginPath(); g.moveTo(cx - 18, 86); g.quadraticCurveTo(cx, 66, cx + 18, 86); g.stroke();
    g.beginPath(); g.arc(cx, 34, 8, 0, Math.PI * 2); g.fill();
    if (i < 3) { g.beginPath(); g.moveTo(cx + 64, 10); g.lineTo(cx + 64, 118); g.stroke(); }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
})();
Object.assign(M, {
  stationStone: mat('#d8ccb0', { roughness: 0.85 }),
  stationBrickRing: mat('#bca67c', { roughness: 0.9 }),
  stationFlat: mat('#ffffff', { roughness: 0.92, map: flatBrickTexture }),
  stationTile: mat('#d9bd94', { roughness: 0.8, map: slateTexture, bumpMap: slateTexture, bumpScale: 1.2 }),
  stationFrame: mat('#4a4f52', { roughness: 0.5 }),
  stationDark: mat('#24272b', { roughness: 0.85 }),
  plinth: mat('#4a4f5a', { roughness: 0.8 }),
  hausuGreen: mat('#1f6e4a', { roughness: 0.38, clearcoat: 0.25, clearcoatRoughness: 0.4 }),
  hausuGreenDeep: mat('#185a3c', { roughness: 0.38, clearcoat: 0.25, clearcoatRoughness: 0.4 }),
  hausuIron: mat('#2f7d5e', { roughness: 0.5, metalness: 0.25 }),
  hausuInterior: mat('#3e3128', { emissive: '#ffad5a', emissiveIntensity: 0 }),
  balconette: new THREE.MeshStandardMaterial({ map: balconetteTexture, transparent: true, alphaTest: 0.4, roughness: 0.5, metalness: 0.2, side: THREE.DoubleSide }),
});
M.balconette.userData.noMerge = true;

// Hipped roof over a rectangle: two sloping sides to a ridge, two hipped ends.
// UVs run up the slope (u) and along the eave (v), in world units, for the tile texture.
function hipRoof(x0, x1, z0, z1, y0, rise, over, material) {
  x0 -= over; x1 += over; z0 -= over; z1 += over;
  const wx = x1 - x0, wz = z1 - z0, half = Math.min(wx, wz) / 2, y1 = y0 + rise;
  const slopeK = Math.hypot(half, rise) / half;
  const mx = (x0 + x1) / 2, mz = (z0 + z1) / 2;
  const [r1, r2] = wx >= wz ? [[x0 + half, mz], [x1 - half, mz]] : [[mx, z0 + half], [mx, z1 - half]];
  const A = [x0, z0], B = [x1, z0], Cc = [x1, z1], D = [x0, z1];
  const faces = wx >= wz
    ? [[A, B, [r2, r1]], [Cc, D, [r1, r2]], [D, A, [r1]], [B, Cc, [r2]]]
    : [[A, B, [r1]], [Cc, D, [r2]], [B, Cc, [r2, r1]], [D, A, [r1, r2]]];
  const pos = [], uv = [];
  for (const [p, q, tops] of faces) {
    const ex = q[0] - p[0], ez = q[1] - p[1], el = Math.hypot(ex, ez), ux = ex / el, uz = ez / el;
    const vert = ([x, z], y) => {
      const along = (x - p[0]) * ux + (z - p[1]) * uz;
      const away = Math.abs((x - p[0]) * uz - (z - p[1]) * ux);
      pos.push(x, y, z); uv.push(away * slopeK, along);
    };
    const tri = (a, ay, b, by, c, cy) => {
      // Wind each triangle so it faces up and out.
      const ab = [b[0] - a[0], by - ay, b[1] - a[1]], ac = [c[0] - a[0], cy - ay, c[1] - a[1]];
      const ny = ab[2] * ac[0] - ab[0] * ac[2];
      if (ny >= 0) { vert(a, ay); vert(b, by); vert(c, cy); } else { vert(a, ay); vert(c, cy); vert(b, by); }
    };
    if (tops.length === 1) tri(p, y0, q, y0, tops[0], y1);
    else { tri(p, y0, q, y0, tops[0], y1); tri(p, y0, tops[0], y1, tops[1], y1); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.computeVertexNormals();
  world.add(mesh(geo, material));
  add(mesh(rbox(x1 - x0, 0.12, z1 - z0, 0.04), M.stationStone), mx, y0 - 0.06, mz);   // soffit
}

// Round-headed window with a stone hood and keystone. o = where the wall surface sits.
function roundWindow(f, s, y0, w, h, { frame = M.stationFrame, glass = M.windowDark, interior = null, o = 0, balcony = false, bars = true } = {}) {
  const r = w / 2;
  f.openings.push([s - w / 2 - 0.26, s + w / 2 + 0.26, y0 - 0.14, y0 + h + 0.4]);
  if (interior) onFace(f, mesh(new THREE.ShapeGeometry(topRound(w, h, r), 16), interior, false), s, y0, o + 0.005);
  onFace(f, mesh(new THREE.ShapeGeometry(topRound(w, h, r), 16), glass, false), s, y0, o + 0.02);
  onFace(f, mesh(ringGeo(w, h, r, 0.07, 0.09), frame), s, y0, o);
  onFace(f, mesh(ringGeo(w + 0.14, h + 0.07, r + 0.07, 0.16, 0.1), M.stationStone), s, y0 - 0.07, o + 0.03);
  faceBox(f, 0.2, 0.32, 0.18, M.stationStone, s, y0 + h + 0.2, o + 0.1, 0.03);
  faceBox(f, w + 0.4, 0.1, 0.28, M.stationStone, s, y0 - 0.05, o + 0.13, 0.03);
  if (bars) {
    faceBox(f, w, 0.06, 0.09, frame, s, y0 + (h - r) * 0.6, o + 0.05, 0.01);
    faceBox(f, 0.04, h - r * 0.35, 0.06, frame, s, y0 + (h - r * 0.35) / 2, o + 0.05, 0.01);
  }
  if (balcony) {
    const bw = w + 0.5;
    faceBox(f, bw + 0.1, 0.1, 0.42, M.stationStone, s, y0 - 0.02, o + 0.21, 0.03);
    onFace(f, mesh(new THREE.PlaneGeometry(bw, 0.55), M.balconette, false), s, y0 + 0.31, o + 0.4);
    faceBox(f, bw + 0.04, 0.05, 0.06, M.hausuIron, s, y0 + 0.6, o + 0.4, 0.015);
    for (const side of [-1, 1]) {
      faceBox(f, 0.04, 0.6, 0.36, M.hausuIron, s + side * bw / 2, y0 + 0.31, o + 0.22, 0.01);
      onFace(f, mesh(new THREE.SphereGeometry(0.045, 8, 6), M.hausuIron), s + side * bw / 2, y0 + 0.66, o + 0.4);
    }
  }
}

// Ground-floor arch: brick voussoirs inside a stone hood, carved imposts and keystone.
// kind: 'window', 'door' or 'open' (a dark arcade entrance).
function groundArch(f, s, w, { kind = 'window', green = false, etch = null, number = null, o = 0 } = {}) {
  const r = w / 2, spring = 2.7, y0 = kind === 'window' ? 0.6 : 0, h = spring + r - y0;
  const frame = green ? M.hausuGreen : M.stationFrame;
  f.openings.push([s - w / 2 - 0.5, s + w / 2 + 0.5, y0 - 0.1, spring + r + 0.5]);
  onFace(f, mesh(ringGeo(w, h, r, 0.3, 0.12), M.stationBrickRing), s, y0, o);
  onFace(f, mesh(ringGeo(w + 0.6, h + 0.3, r + 0.3, 0.13, 0.16), M.stationStone), s, y0 - 0.3, o + 0.02);
  faceBox(f, 0.32, 0.5, 0.24, M.stationStone, s, spring + r + 0.2, o + 0.12, 0.04);              // keystone
  faceBox(f, 0.16, 0.26, 0.04, M.stationBrickRing, s, spring + r + 0.18, o + 0.25, 0.02);
  for (const side of [-1, 1]) faceBox(f, 0.5, 0.24, 0.26, M.stationStone, s + side * (w / 2 + 0.22), spring, o + 0.13, 0.04);
  if (kind === 'open') {
    onFace(f, mesh(new THREE.ShapeGeometry(topRound(w, h, r), 16), M.stationDark, false), s, y0, o + 0.005);
    onFace(f, mesh(ringGeo(w - 0.1, h - 0.05, r - 0.05, 0.06, 0.08), frame), s, y0, o + 0.01);
    return;
  }
  if (kind === 'window') {
    faceBox(f, w + 0.5, 0.12, 0.3, M.stationStone, s, y0 - 0.06, o + 0.14, 0.03);
    onFace(f, mesh(new THREE.ShapeGeometry(topRound(w, h, r), 16), green ? M.hausuInterior : M.stationDark, false), s, y0, o + 0.005);
    onFace(f, mesh(new THREE.ShapeGeometry(topRound(w, h, r), 16), green ? M.pubGlass : M.windowDark, false), s, y0, o + 0.025);
    onFace(f, mesh(ringGeo(w, h, r, 0.08, 0.1), frame), s, y0, o);
    faceBox(f, w, 0.07, 0.1, frame, s, spring - 0.45, o + 0.05, 0.01);
    if (etch) onFace(f, canvasPlane(w * 0.9, 1.45, etch, { transparent: true, glow: 0.4 }), s, y0 + 0.82, o + 0.035);
    return;
  }
  // Double doors with a fanlight above.
  onFace(f, mesh(new THREE.ShapeGeometry(topRound(w, h, r), 16), M.hausuInterior, false), s, y0, o + 0.005);
  onFace(f, mesh(new THREE.ShapeGeometry(topRound(w, h, r), 16), M.pubGlass, false), s, y0, o + 0.025);
  onFace(f, mesh(ringGeo(w, h, r, 0.08, 0.1), frame), s, y0, o);
  const leafH = spring - 0.1;
  faceBox(f, w, 0.1, 0.12, frame, s, leafH + 0.05, o + 0.05, 0.02);
  for (const side of [-1, 1]) {
    const ls = s + side * w / 4;
    faceBox(f, w / 2 - 0.03, leafH, 0.08, frame, ls, leafH / 2, o + 0.05, 0.02);
    faceBox(f, w / 2 - 0.3, leafH * 0.42, 0.03, M.pubGlass, ls, leafH * 0.68, o + 0.095, 0.01);
    faceBox(f, w / 2 - 0.3, leafH * 0.42, 0.03, M.hausuInterior, ls, leafH * 0.68, o + 0.085, 0.01);
    for (const y of [0.3, 0.75]) faceBox(f, w / 2 - 0.3, leafH * 0.18, 0.04, M.hausuGreenDeep, ls, leafH * y - (y > 0.5 ? leafH * 0.2 : 0), o + 0.1, 0.015);
  }
  faceBox(f, 0.06, 0.06, 0.06, M.brass, s + 0.12, 1.3, o + 0.12, 0.02);
  if (number) onFace(f, canvasPlane(0.6, 0.24, number, { glow: 0.5 }), s, leafH + 0.45, o + 0.04);
}

function aBoard(x, z, rotY, label = 'HAUSU') {
  const g = new THREE.Group();
  const L = 0.95, tilt = 0.17, top = L * Math.cos(tilt) + 0.02;
  const chalk = (c, W, H) => {
    c.fillStyle = '#26292a'; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(240,240,232,0.92)'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = `${Math.round(W * 0.22)}px "Caveat Brush", "Marker Felt", cursive`;
    c.fillText(label, W / 2, H * 0.16);
    c.strokeStyle = 'rgba(240,240,232,0.6)'; c.lineWidth = W * 0.012; c.lineCap = 'round';
    const r = rng(9);
    for (let i = 0; i < 6; i++) {
      const y = H * (0.34 + i * 0.1);
      c.beginPath(); c.moveTo(W * 0.18, y);
      for (let k = 1; k <= 6; k++) c.lineTo(W * (0.18 + k * 0.1 * (0.6 + r() * 0.5)), y + (r() - 0.5) * H * 0.02);
      c.stroke();
    }
  };
  for (const side of [-1, 1]) {
    // Each leaf hangs from the shared hinge at the top and splays outward at the foot.
    const pivot = child(g, new THREE.Group(), 0, top, 0);
    pivot.rotation.x = -side * tilt;
    child(pivot, mesh(rbox(0.62, L, 0.04, 0.015), M.darkWood), 0, -L / 2, side * 0.022);
    const face = child(pivot, canvasPlane(0.5, 0.78, chalk, { glow: 0 }), 0, -L / 2 - 0.03, side * 0.046);
    if (side < 0) face.rotation.y = Math.PI;
  }
  add(g, x, 0.08, z, rotY);
}

function buildStation() {
  currentPlace = null;
  const G = 4.0, F1 = 7.4, EAV = 11.3, EAVC = 12.5;
  const ZF = 23, ZW = 35, ZB = 40;
  const HX0 = -47, HX1 = -41.5;            // Hausu's wing
  const LX0 = -28.5, LX1 = -23;            // the other wing
  const hausuWing = rect(HX0, HX1, ZF, ZW), leftWing = rect(LX0, LX1, ZF, ZW), central = rect(HX0, LX1, ZW, ZB);
  for (const p of [hausuWing, leftWing]) prism(p, 0, EAV, M.stationFlat);
  prism(central, 0, EAVC, M.stationFlat);

  // Plain walls get the canvas brick; these hero faces get real bricks.
  const fHE = face([HX1, ZF], [HX0, ZF], { brick: STATION_BRICK[0] });     // Hausu, round the corner (street side)
  const fHI = face([HX1, ZW], [HX1, ZF], { brick: STATION_BRICK[0] });     // Hausu, into the square
  const fLE = face([LX1, ZF], [LX0, ZF], { brick: STATION_BRICK[0] });
  const fLI = face([LX0, ZF], [LX0, ZW], { brick: STATION_BRICK[0] });
  const fCF = face([LX0, ZW], [HX1, ZW], { brick: STATION_BRICK[0] });     // central block, facing the square

  // ── Hausu: green doors and windows, ground and first floor ──
  currentPlace = 'hausu';
  // White line doodles etched on the glass, with the logo across and up the side.
  const etch = (g, W, H) => {
    const r = rng(55);
    g.strokeStyle = 'rgba(245,245,240,0.55)'; g.lineWidth = W * 0.007; g.lineCap = 'round';
    for (let i = 0; i < 9; i++) {
      g.beginPath(); g.moveTo(r() * W, r() * H);
      g.bezierCurveTo(r() * W, r() * H, r() * W, r() * H, r() * W, r() * H); g.stroke();
    }
    for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(r() * W, r() * H, W * (0.04 + r() * 0.07), 0, Math.PI * 2); g.stroke(); }
    g.fillStyle = 'rgba(250,250,245,0.92)'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `${Math.round(W * 0.16)}px "Caveat Brush", "Marker Felt", cursive`;
    g.fillText('HAUSU', W * 0.62, H * 0.18);
    g.save(); g.translate(W * 0.1, H * 0.5); g.rotate(Math.PI / 2);
    g.font = `${Math.round(W * 0.1)}px "Caveat Brush", "Marker Felt", cursive`;
    g.fillText('HAUSU', 0, 0); g.restore();
  };
  const number = (g, W, H) => {
    g.fillStyle = '#1f6e4a'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#f2efe6'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `600 ${Math.round(H * 0.7)}px "Barlow Semi Condensed", Arial, sans-serif`;
    g.fillText('11A', W / 2, H * 0.56);
  };
  const HE = [1.3, 4.2];                   // Hausu's two arches round the corner
  groundArch(fHE, HE[0], 1.5, { kind: 'window', green: true, etch });
  groundArch(fHE, HE[1], 1.5, { kind: 'door', green: true, number });
  // Into the square: just two arched bays with generous brick between and at either end:
  // the door nearest the station, then a window, the menu lightbox between them.
  const HI = [3.4, 8.4];
  groundArch(fHI, HI[0], 1.5, { kind: 'door', green: true });
  groundArch(fHI, HI[1], 1.5, { kind: 'window', green: true, etch });
  for (const f of [fHE, fHI]) {
    const ss = f === fHE ? HE : HI;
    for (const s of ss) roundWindow(f, s, 4.75, 1.05, 2.05, { frame: M.hausuGreen, glass: M.pubGlass, interior: M.hausuInterior, balcony: f === fHE });
  }
  // Menu lightbox, as on both walls: black frame, lit peach header with the hand-drawn
  // HAUSU logo, glowing orange panel holding the menu sheet, little black sunburst below.
  const lightbox = (f, s) => {
    faceBox(f, 0.5, 0.95, 0.12, mat('#170e13', { roughness: 0.5 }), s, 1.8, 0.07, 0.02);
    onFace(f, canvasPlane(0.43, 0.87, (g, W, H) => {
      g.fillStyle = '#170e13'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#fbe4aa'; g.fillRect(W * 0.05, H * 0.03, W * 0.9, H * 0.2);
      g.fillStyle = '#1a1414'; g.textBaseline = 'middle';
      g.font = `${Math.round(H * 0.12)}px "Caveat Brush", "Marker Felt", cursive`;
      spacedText(g, 'HAUSU', W / 2, H * 0.135, W * 0.035, W * 0.82);
      const glow = g.createRadialGradient(W / 2, H * 0.6, W * 0.05, W / 2, H * 0.6, W * 0.7);
      glow.addColorStop(0, '#ffc6a6'); glow.addColorStop(1, '#f2875c');
      g.fillStyle = glow; g.fillRect(W * 0.05, H * 0.26, W * 0.9, H * 0.71);
      g.fillStyle = '#f7ebee'; g.fillRect(W * 0.24, H * 0.33, W * 0.52, H * 0.43);
      g.fillStyle = '#bda9ae';
      for (let i = 0; i < 12; i++) g.fillRect(W * 0.3, H * (0.37 + i * 0.03), W * (0.26 + (i % 4) * 0.06), H * 0.006);
      const cx = W / 2, cy = H * 0.94, rr = W * 0.15;
      g.fillStyle = '#1a1414';
      g.beginPath(); g.arc(cx, cy, rr * 0.28, Math.PI, 0); g.fill();
      g.strokeStyle = '#1a1414'; g.lineWidth = W * 0.014;
      for (let k = 0; k <= 10; k++) {
        const ang = Math.PI + (k / 10) * Math.PI;
        g.beginPath(); g.moveTo(cx + Math.cos(ang) * rr * 0.38, cy + Math.sin(ang) * rr * 0.38);
        g.lineTo(cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr); g.stroke();
      }
    }, { glow: 0.9 }), s, 1.8, 0.135);
  };
  lightbox(fHE, 2.75);
  lightbox(fHI, (HI[0] + HI[1]) / 2);
  // Carved acanthus band at the springing line, running between the arches.
  const friezeTex = (() => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#cfc4a8'; g.fillRect(0, 0, 256, 64);
    for (let i = 0; i < 4; i++) {
      const x = 32 + i * 64;
      g.fillStyle = '#8f8570';
      g.beginPath(); g.ellipse(x - 14, 34, 16, 9, -0.6, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(x + 14, 34, 16, 9, 0.6, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#e4dbc2';
      g.beginPath(); g.ellipse(x - 12, 31, 11, 5, -0.6, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(x + 12, 31, 11, 5, 0.6, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(x, 30, 6, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = '#9d937d'; g.fillRect(0, 0, 256, 5); g.fillRect(0, 59, 256, 5);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    return tex;
  })();
  const frieze = (f, arches, w) => {
    const cuts = arches.map(a => [a - w / 2 - 0.45, a + w / 2 + 0.45]).sort((p, q) => p[0] - q[0]);
    let from = 0;
    for (const [a, b] of [...cuts, [f.len, f.len]]) {
      if (a - from > 0.3) {
        const len = a - from, mid = (from + a) / 2;
        faceBox(f, len, 0.3, 0.2, M.stationStone, mid, 2.72, 0.12, 0.03);
        const tex = friezeTex.clone(); tex.needsUpdate = true; tex.repeat.set(len / 0.9, 1);
        const m = mat('#ffffff', { map: tex, bumpMap: tex, bumpScale: 2, roughness: 0.85 });
        m.userData.noMerge = true;
        onFace(f, mesh(new THREE.PlaneGeometry(len, 0.26), m, false), mid, 2.72, 0.225);
      }
      from = Math.max(from, b);
    }
  };
  frieze(fHE, HE, 1.5);
  frieze(fHI, HI, 1.5);
  {
    const g = new THREE.Group();
    child(g, mesh(rbox(0.1, 0.9, 0.08, 0.02), M.iron), 0, 0, 0.04);
    child(g, mesh(rbox(0.7, 0.07, 0.07, 0.02), M.iron), 0, 0.42, 0.12);
    for (const side of [-1, 1]) {
      const tube = child(g, mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.42, 8), M.lampGlass, false), side * 0.32, 0.2, 0.16);
      tube.rotation.z = side * 0.25;
    }
    onFace(fHE, g, 2.75, 3.25, 0.06);
    const p = facePoint(fHE, 2.75, 3.2, 0.6);
    const light = new THREE.PointLight('#ffc27a', 0, 6, 1.6);
    light.position.copy(p); world.add(light);
    nightLights.push({ light, max: 4 });
  }
  aBoard(-40.4, 26.2, Math.PI / 2 + 0.25);

  // ── The rest of the station: same architecture, neutral frames ──
  currentPlace = null;
  groundArch(fLE, 1.45, 1.5, { kind: 'window' });
  groundArch(fLE, 4.05, 1.5, { kind: 'window' });
  const LI = [1.4, 4.2, 7.0, 9.8], CF = [1.2, 3.3, 5.4, 7.6, 9.7, 11.8];
  groundArch(fLI, LI[0], 1.5, { kind: 'window' });
  groundArch(fLI, LI[1], 1.5, { kind: 'open' });
  groundArch(fLI, LI[2], 1.5, { kind: 'window' });
  groundArch(fLI, LI[3], 1.5, { kind: 'window' });
  for (const s of CF) groundArch(fCF, s, 1.35, { kind: 'open' });
  for (const s of [1.45, 4.05]) roundWindow(fLE, s, 4.75, 1.05, 2.05);
  for (const s of LI) roundWindow(fLI, s, 4.75, 1.05, 2.05);
  for (const s of CF) {
    roundWindow(fCF, s, 4.7, 0.9, 1.95);
    roundWindow(fCF, s, 7.95, 1.0, 2.3);
  }
  // Second floor of both wings: paired narrow arches.
  for (const [f, ss] of [[fHE, HE], [fHI, HI], [fLE, [1.45, 4.05]], [fLI, LI]]) {
    for (const s of ss) for (const d of [-0.33, 0.33]) roundWindow(f, s + d, 8.05, 0.52, 1.75, { bars: false });
  }
  // Central balcony with a plain railing, and three roundels in the attic.
  faceBox(fCF, 8.8, 0.16, 0.7, M.stationStone, 6.5, 7.8, 0.35, 0.04);
  {
    const list = [];
    for (let s = 2.15; s <= 10.85; s += 0.12) list.push([s, 7.88, 0.62, 0.62]);
    bars(fCF, list, 0.014, M.stationFrame);
    faceBox(fCF, 8.7, 0.05, 0.06, M.stationFrame, 6.5, 8.52, 0.62, 0.015);
  }
  for (const s of [5.0, 6.5, 8.0]) {
    fCF.openings.push([s - 0.5, s + 0.5, 11.3, 12.3]);
    const ring = new THREE.Group();
    child(ring, mesh(new THREE.TorusGeometry(0.36, 0.1, 10, 28), M.stationStone), 0, 0, 0.05);
    child(ring, mesh(new THREE.CircleGeometry(0.3, 24), M.windowDark, false), 0, 0, 0.02);
    onFace(fCF, ring, s, 11.8, 0);
  }

  // Stone bands, blue-brick plinth, bricks and modillion cornices on the faces you see.
  for (const f of [fHE, fHI, fLE, fLI, fCF]) {
    const top = f === fCF ? EAVC : EAV;
    faceBox(f, f.len + 0.1, 0.3, 0.26, M.stationStone, f.len / 2, G, 0.13, 0.04);
    faceBox(f, f.len + 0.1, 0.22, 0.22, M.stationStone, f.len / 2, F1, 0.11, 0.04);
    if (f === fCF) faceBox(f, f.len + 0.1, 0.22, 0.22, M.stationStone, f.len / 2, EAV, 0.11, 0.04);
    faceBox(f, f.len + 0.2, 0.32, 0.5, M.stationStone, f.len / 2, top - 0.05, 0.25, 0.05);
    const mods = [];
    for (let s = 0.2; s < f.len - 0.1; s += 0.45) {
      const p = facePoint(f, s, top - 0.32, 0.12);
      mods.push(new THREE.BoxGeometry(0.14, 0.22, 0.24).rotateY(f.rotY).translate(p.x, p.y, p.z));
    }
    world.add(mesh(mergeGeometries(mods), M.stationStone));
    layBricks(f, 0, 0.5, { color: PLINTH_BRICK });
    layBricks(f, 0.5, top - 0.2, { color: STATION_BRICK });
  }
  // Plain sides: a plinth band and a few windows on the canvas brick.
  for (const [P, Q, ss] of [[[HX0, ZF], [HX0, ZW], [2, 5, 8, 11]], [[LX1, ZW], [LX1, ZF], [1.5, 4.5, 7.5, 10.5]], [[HX0, ZB], [LX1, ZB], [2, 5, 8, 11, 14, 17, 20, 23]], [[HX0, ZW], [HX0, ZB], [2.5]], [[LX1, ZB], [LX1, ZW], [2.5]]]) {
    const f = face(P, Q);
    faceBox(f, f.len, 0.5, 0.04, M.plinth, f.len / 2, 0.25, 0.01, 0.01);
    faceBox(f, f.len + 0.1, 0.22, 0.2, M.stationStone, f.len / 2, G, 0.1, 0.03);
    for (const s of ss) {
      roundWindow(f, s, 4.75, 0.9, 1.9, { o: 0.03 });
      roundWindow(f, s, 8.05, 0.8, 1.75, { o: 0.03, bars: false });
    }
  }

  // Roofs: hipped, pale tiles.
  hipRoof(HX0, HX1, ZF, ZW, EAV + 0.15, 1.9, 0.4, M.stationTile);
  hipRoof(LX0, LX1, ZF, ZW, EAV + 0.15, 1.9, 0.4, M.stationTile);
  hipRoof(HX0, LX1, ZW, ZB, EAVC + 0.15, 1.7, 0.4, M.stationTile);

  // The square: terracotta brick paving either side of a grey band, plus an info board.
  {
    const board = new THREE.Group();
    for (const dx of [-0.75, 0.75]) child(board, mesh(rbox(0.08, 2.4, 0.08, 0.02), M.stationFrame), dx, 1.2, 0);
    child(board, mesh(rbox(1.6, 1.1, 0.06, 0.02), mat('#e9e6dc', { roughness: 0.7 })), 0, 1.75, 0);
    add(board, -33.4, 0.08, 27.6, 0.5);
  }
  currentPlace = null;
  return {
    polys: [hausuWing, leftWing, central],
    square: { x0: HX1, x1: LX0, z0: ZF, z1: ZW, band: [-36.5, -33.5] },
  };
}

// ── Camberwell Arms, No. 65 ────────────────────────────────────────────────────
// Across the road from the Tamil Prince, next to the station with a paved alley between.
// A deep green Victorian pub front: six green pilasters with white Corinthian capitals, a
// gold-lettered fascia (No. 65 · CAMBERWELL ARMS · 020 7358 4364), white-framed windows with
// transom lights, timber stallrisers, black doors at each end, a carriage lantern, hanging
// baskets and timber planters. Above: a cream stucco band with carved scroll panels and a
// trough of flowers, then red brick with stucco quoins, pedimented first-floor windows (the
// middle one segmental with a carved tympanum) and plain sashes on the second floor.
Object.assign(M, {
  camGreen: mat('#23443a', { roughness: 0.38, clearcoat: 0.25, clearcoatRoughness: 0.4 }),
  camGreenDeep: mat('#1b362e', { roughness: 0.38, clearcoat: 0.25, clearcoatRoughness: 0.4 }),
  camWhite: mat('#efebe1', { roughness: 0.6 }),
  camStucco: mat('#e9e3d5', { roughness: 0.8 }),
  camTimber: mat('#6b5644', { roughness: 0.85 }),
  camDoor: mat('#16191a', { roughness: 0.45 }),
  camInterior: mat('#7a5a3e', { emissive: '#ffb25e', emissiveIntensity: 0 }),
  camMortar: mat('#86604c', { roughness: 0.95 }),
});
const CAM_BRICK = ['#9c5a43', '#a8634a', '#8e503c', '#b06d50', '#94573f', '#7f4a38'];

function buildCamberwell() {
  currentPlace = 'camberwell';
  const X0 = -21, X1 = -13, ZF = 23, ZB = 29.5, W = X1 - X0;
  const G = 2.8, FASC = 3.5, BAND = 4.35, F1 = 4.35, F2 = 7.0, TOP = 9.1, PAR = 9.7;
  const foot = rect(X0, X1, ZF, ZB);
  const f = face([X1, ZF], [X0, ZF], { brick: CAM_BRICK[0] });         // street front, s from the left as you face it
  const fE = face([X1, ZB], [X1, ZF], { brick: CAM_BRICK[0] });        // east end: party wall with the terrace
  const fW = face([X0, ZF], [X0, ZB], { brick: CAM_BRICK[0] });        // west end, on the alley
  const fB = face([X0, ZB], [X1, ZB], { brick: CAM_BRICK[0] });

  prism(foot, 0, 0.06, M.pubFloor);
  prism(rect(X0, X1, ZF + 1.0, ZB), 0, FASC, M.camInterior);
  prism(foot, FASC, TOP, M.camMortar);
  prism(foot, TOP, PAR, M.camMortar, { holes: [inset(foot, 0.25)] });
  prism(inset(foot, 0.24), TOP, TOP + 0.04, M.roof);
  prism(inset(foot, -0.05), PAR, PAR + 0.14, M.camStucco, { holes: [inset(foot, 0.3)], bevel: 0.03 });

  // ── Ground floor ──
  f.openings.push([0, W, -1, FASC + 0.1]);
  const P = [0.16, 1.3, 3.05, 4.95, 6.7, 7.84];          // pilaster centres
  const capital = s => {
    const g = new THREE.Group();
    child(g, mesh(rbox(0.5, 0.12, 0.42, 0.03), M.camWhite), 0, 0.3, 0.21);                 // abacus
    child(g, mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.36, 12), M.camWhite), 0, 0.06, 0.2);
    for (const sx of [-1, 1]) {
      const v = child(g, mesh(new THREE.TorusGeometry(0.07, 0.03, 8, 14), M.camWhite), sx * 0.19, 0.17, 0.36);
      v.rotation.y = Math.PI / 2;
    }
    for (let i = 0; i < 5; i++) {
      const leaf = child(g, mesh(new THREE.SphereGeometry(0.075, 8, 6), M.camWhite), -0.16 + i * 0.08, -0.05 + (i % 2) * 0.08, 0.36);
      leaf.scale.set(0.8, 1.3, 0.6);
    }
    child(g, mesh(rbox(0.32, 0.06, 0.3, 0.02), M.camWhite), 0, -0.14, 0.17);              // necking
    onFace(f, g, s, G - 0.12, 0.0);
  };
  for (const s of P) {
    faceBox(f, 0.3, G - 0.3, 0.26, M.camGreen, s, (G - 0.3) / 2, 0.12, 0.03);
    faceBox(f, 0.36, 0.22, 0.32, M.camGreenDeep, s, 0.11, 0.15, 0.03);
    faceBox(f, 0.16, 1.5, 0.03, M.camGreenDeep, s, 1.3, 0.26, 0.01);
    capital(s);
  }
  // Fascia, gold letters, and the moulded cornice above it.
  faceBox(f, W + 0.1, 0.72, 0.36, M.camGreen, W / 2, (G + 0.15 + FASC) / 2 + 0.02, 0.17, 0.03);
  faceBox(f, W + 0.24, 0.12, 0.5, M.camGreenDeep, W / 2, FASC + 0.04, 0.24, 0.03);
  faceBox(f, W + 0.3, 0.06, 0.58, M.camGreen, W / 2, FASC + 0.13, 0.27, 0.02);
  const dent = [];
  for (let s = 0.1; s < W; s += 0.16) {
    const p = facePoint(f, s, FASC - 0.08, 0.38);
    dent.push(new THREE.BoxGeometry(0.07, 0.07, 0.06).rotateY(f.rotY).translate(p.x, p.y, p.z));
  }
  world.add(mesh(mergeGeometries(dent), M.camGreenDeep));
  onFace(f, canvasPlane(W - 0.1, 0.6, (g, Wc, Hc) => {
    g.fillStyle = '#23443a'; g.fillRect(0, 0, Wc, Hc);
    g.strokeStyle = 'rgba(214,176,98,0.5)'; g.lineWidth = Hc * 0.02; g.strokeRect(Hc * 0.06, Hc * 0.08, Wc - Hc * 0.12, Hc * 0.84);
    g.fillStyle = '#d4ad60'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowOffsetY = Hc * 0.03; g.shadowBlur = Hc * 0.03;
    g.font = `600 ${Math.round(Hc * 0.62)}px "Cormorant Garamond", "Newsreader", Georgia, serif`;
    spacedText(g, 'CAMBERWELL ARMS', Wc * 0.5, Hc * 0.56, Hc * 0.1, Wc * 0.58);
    g.font = `600 ${Math.round(Hc * 0.46)}px "Cormorant Garamond", "Newsreader", Georgia, serif`;
    spacedText(g, 'Nº65', Wc * 0.08, Hc * 0.56, Hc * 0.04);
    g.font = `600 ${Math.round(Hc * 0.38)}px "Cormorant Garamond", "Newsreader", Georgia, serif`;
    spacedText(g, '020 7358 4364', Wc * 0.89, Hc * 0.56, Hc * 0.02);
  }, { glow: 0.45, res: 3072 }), W / 2, (G + 0.15 + FASC) / 2 + 0.02, 0.355);

  // Window bays: timber stallriser, big white-framed window, a row of transom lights above.
  const bay = (a, b, transoms) => {
    const w = b - a, m = (a + b) / 2;
    faceBox(f, w, 0.72, 0.1, M.camTimber, m, 0.36, 0.06, 0.01);
    for (let y = 0.1; y < 0.7; y += 0.11) faceBox(f, w, 0.02, 0.12, mat('#4e3f33', { roughness: 0.9 }), m, y, 0.06, 0.005);
    faceBox(f, w, 0.08, 0.22, M.camGreenDeep, m, 0.74, 0.1, 0.02);
    onFace(f, mesh(new THREE.PlaneGeometry(w - 0.1, 1.9), M.pubGlass, false), m, 1.75, 0.02);
    const wf = (ww, hh, s, y) => {
      faceBox(f, ww, 0.08, 0.1, M.camWhite, s, y - hh / 2 + 0.04, 0.05, 0.01);
      faceBox(f, ww, 0.08, 0.1, M.camWhite, s, y + hh / 2 - 0.04, 0.05, 0.01);
      faceBox(f, 0.08, hh, 0.1, M.camWhite, s - ww / 2 + 0.04, y, 0.05, 0.01);
      faceBox(f, 0.08, hh, 0.1, M.camWhite, s + ww / 2 - 0.04, y, 0.05, 0.01);
    };
    wf(w - 0.08, 1.38, m, 1.5);                                  // main window
    faceBox(f, w - 0.1, 0.06, 0.08, M.camWhite, m, 1.62, 0.06, 0.01);
    wf(w - 0.08, 0.58, m, 2.5);                                  // transom row
    for (let i = 1; i < transoms; i++) faceBox(f, 0.06, 0.55, 0.08, M.camWhite, a + w * i / transoms, 2.5, 0.06, 0.01);
    faceBox(f, w - 0.1, 0.05, 0.06, M.windowDark, m, 2.0, 0.03, 0.01);                     // blind line
  };
  bay(P[1] + 0.15, P[2] - 0.15, 3);
  bay(P[2] + 0.15, P[3] - 0.15, 1);
  bay(P[3] + 0.15, P[4] - 0.15, 3);
  // Doors at both ends, under blank boarded panels; a timber bench under the right window.
  for (const [a, b] of [[P[0] + 0.15, P[1] - 0.15], [P[4] + 0.15, P[5] - 0.15]]) {
    const w = b - a, m = (a + b) / 2;
    faceBox(f, w, 0.75, 0.06, M.camWhite, m, 2.4, 0.05, 0.02);
    for (let y = 2.1; y < 2.75; y += 0.1) faceBox(f, w - 0.1, 0.02, 0.08, mat('#d8d3c7'), m, y, 0.06, 0.005);
    faceBox(f, w, 2.05, 0.06, M.camDoor, m, 1.02, -0.02, 0.02);
    faceBox(f, 0.02, 1.95, 0.07, mat('#2a2e30'), m, 1.0, 0.0, 0.005);
    for (const dx of [-0.08, 0.08]) faceBox(f, 0.03, 0.35, 0.05, M.steel, m + dx, 1.1, 0.03, 0.01);
    faceBox(f, w + 0.1, 0.1, 0.3, M.stone, m, 0.05, 0.12, 0.02);
  }
  faceBox(f, 1.5, 0.08, 0.36, M.camTimber, (P[3] + P[4]) / 2, 0.45, 0.26, 0.02);
  for (const dx of [-0.6, 0.6]) faceBox(f, 0.06, 0.4, 0.3, M.camTimber, (P[3] + P[4]) / 2 + dx, 0.24, 0.26, 0.01);
  // Carriage lantern over the right-hand door.
  {
    const g = new THREE.Group();
    child(g, mesh(rbox(0.05, 0.05, 0.3, 0.01), M.iron), 0, 0.25, 0.15);
    child(g, mesh(new THREE.CylinderGeometry(0.15, 0.1, 0.36, 4, 1), M.lampGlass, false), 0, 0.0, 0.32).rotation.y = Math.PI / 4;
    child(g, mesh(new THREE.ConeGeometry(0.2, 0.18, 4), M.iron), 0, 0.27, 0.32).rotation.y = Math.PI / 4;
    child(g, mesh(new THREE.SphereGeometry(0.04, 8, 6), M.iron), 0, 0.39, 0.32);
    onFace(f, g, (P[4] + P[5]) / 2 + 0.2, 2.15, 0.2);
    const l = new THREE.PointLight('#ffbf76', 0, 5, 1.6);
    l.position.copy(facePoint(f, (P[4] + P[5]) / 2 + 0.2, 2.1, 0.7)); world.add(l);
    nightLights.push({ light: l, max: 3 });
  }
  // Hanging baskets on every pilaster, and timber planters at their feet.
  const r = rng(6565);
  const flowers = ['#e8c23a', '#7c4fa0', '#f2efe6', '#c43a5a', '#e8892e'].map(c => new THREE.Color(c));
  const greens = ['#4f6b35', '#5e7a3e', '#6d8445'].map(c => new THREE.Color(c));
  const bloom = (cx, cy, cz, rad, n, flat = 1) => {
    for (let i = 0; i < n; i++) {
      const u = r(), v = r() * 2 - 1, ang = r() * Math.PI * 2, rr = Math.cbrt(u) * rad, sv = Math.sqrt(1 - v * v);
      treeLeaves.push({ x: cx + Math.cos(ang) * sv * rr, y: cy + v * rr * flat, z: cz + Math.sin(ang) * sv * rr,
        rx: r() * Math.PI, ry: r() * Math.PI * 2, rz: r() * Math.PI, s: 0.09 + r() * 0.05,
        color: r() < 0.45 ? flowers[Math.floor(r() * flowers.length)] : greens[Math.floor(r() * greens.length)] });
    }
  };
  for (const s of P) {
    const bracket = new THREE.Group();
    child(bracket, mesh(rbox(0.03, 0.03, 0.42, 0.01), M.iron), 0, 0, 0.21);
    for (const dx of [-0.12, 0.12]) {
      const ch = child(bracket, mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.45, 4), M.iron), dx * 0.5, -0.2, 0.42);
      ch.rotation.z = dx;
    }
    child(bracket, mesh(new THREE.SphereGeometry(0.2, 12, 8, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), mat('#6a5236', { roughness: 1 })), 0, -0.42, 0.42);
    onFace(f, bracket, s, 2.15, 0.26);
    const p = facePoint(f, s, 1.78, 0.68);
    bloom(p.x, p.y, p.z, 0.32, 70, 0.6);
    const q = facePoint(f, s, 0.45, 0.5);
    add(mesh(rbox(0.38, 0.85, 0.32, 0.03), M.camTimber), q.x, 0.43, q.z, f.rotY);
    bloom(q.x, 1.0, q.z, 0.22, 28, 0.5);
  }

  // ── Stucco band with scroll panels, and a trough of flowers along its ledge ──
  faceBox(f, W + 0.06, BAND - FASC - 0.2, 0.16, M.camStucco, W / 2, (FASC + 0.2 + BAND) / 2, 0.08, 0.02);
  const scroll = (g, Wc, Hc) => {
    g.fillStyle = '#e9e3d5'; g.fillRect(0, 0, Wc, Hc);
    g.strokeStyle = '#a39983'; g.lineWidth = Hc * 0.08; g.lineCap = 'round';
    g.beginPath(); g.moveTo(Wc * 0.04, Hc * 0.5);
    for (let k = 0; k < 6; k++) {
      const x = Wc * (0.04 + k * 0.155);
      g.bezierCurveTo(x + Wc * 0.04, Hc * (k % 2 ? 0.95 : 0.05), x + Wc * 0.11, Hc * (k % 2 ? 0.95 : 0.05), x + Wc * 0.155, Hc * 0.5);
    }
    g.stroke();
    g.fillStyle = '#a39983';
    for (let k = 0; k < 6; k++) { g.beginPath(); g.arc(Wc * (0.115 + k * 0.155), Hc * (k % 2 ? 0.72 : 0.28), Hc * 0.1, 0, Math.PI * 2); g.fill(); }
  };
  for (const s of [1.3, 4.0, 6.7]) onFace(f, canvasPlane(1.7, 0.26, scroll, { glow: 0 }), s, (FASC + 0.2 + BAND) / 2, 0.165);
  faceBox(f, W + 0.2, 0.1, 0.4, M.camStucco, W / 2, BAND + 0.02, 0.2, 0.03);
  faceBox(f, W - 0.3, 0.2, 0.26, M.camTimber, W / 2, BAND + 0.17, 0.25, 0.02);
  for (let s = 0.4; s < W - 0.3; s += 0.5) {
    const p = facePoint(f, s, BAND + 0.38, 0.28);
    bloom(p.x, p.y, p.z, 0.26, 26, 0.5);
  }

  // ── Upper floors: red brick between stucco quoins ──
  for (const s of [0.22, W - 0.22]) {
    f.openings.push([s - 0.24, s + 0.24, F1, TOP]);
    for (let y = F1, k = 0; y < TOP - 0.1; y += 0.42, k++) faceBox(f, k % 2 ? 0.36 : 0.46, 0.38, 0.12, M.camStucco, s + (k % 2 ? (s < 1 ? -0.05 : 0.05) : 0), y + 0.2, 0.05, 0.03);
  }
  const pediment = (s, yTop, w) => {
    const sh = new THREE.Shape();
    sh.moveTo(-w / 2, 0); sh.lineTo(w / 2, 0); sh.lineTo(0, 0.42); sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh, { depth: 0.18, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.03, bevelSegments: 2 });
    f.openings.push([s - w / 2 - 0.05, s + w / 2 + 0.05, yTop, yTop + 0.5]);
    onFace(f, mesh(g, M.camStucco), s, yTop, 0.02);
    faceBox(f, w * 0.7, 0.04, 0.05, M.camWhite, s, yTop + 0.1, 0.19, 0.01);
  };
  const winX = [1.55, 4.0, 6.45];
  winX.forEach((s, i) => {
    sashWindow(f, s, 4.75, 0.95, 1.55, { surround: true, lintel: false, glass: rng(i + 3)() > 0.4 ? M.windowGlass : M.windowDark, surroundMat: M.camStucco });
    for (const dx of [-0.6, 0.6]) faceBox(f, 0.14, 0.32, 0.18, M.camStucco, s + dx, 6.55, 0.12, 0.03);    // consoles
    faceBox(f, 1.4, 0.1, 0.28, M.camStucco, s, 6.62, 0.14, 0.03);
    if (i === 1) {
      archHead(f, s, 6.7, 1.15, M.camStucco, { rise: 0.38, t: 0.12 });
      onFace(f, canvasPlane(0.8, 0.3, (g, Wc, Hc) => {
        g.fillStyle = '#e9e3d5'; g.fillRect(0, 0, Wc, Hc);
        g.fillStyle = '#b39a5c';
        g.beginPath(); g.ellipse(Wc / 2, Hc * 0.65, Wc * 0.1, Hc * 0.28, 0, 0, Math.PI * 2); g.fill();
        for (const sx of [-1, 1]) { g.beginPath(); g.ellipse(Wc / 2 + sx * Wc * 0.22, Hc * 0.7, Wc * 0.16, Hc * 0.14, sx * 0.3, 0, Math.PI * 2); g.fill(); }
      }, { transparent: false, glow: 0 }), s, 6.86, 0.03);
    } else pediment(s, 6.68, 1.3);
  });
  faceBox(f, W, 0.16, 0.22, M.camStucco, W / 2, F2 + 0.15, 0.1, 0.03);
  winX.forEach((s, i) => sashWindow(f, s, 7.45, 0.9, 1.25, { surround: true, lintel: false, panes: 'two', glass: rng(i + 30)() > 0.5 ? M.windowGlass : M.windowDark, surroundMat: M.camStucco }));
  faceBox(f, W + 0.12, 0.28, 0.36, M.camStucco, W / 2, TOP + 0.02, 0.17, 0.04);
  layBricks(f, F1, TOP - 0.1, { color: CAM_BRICK });
  layBricks(f, TOP + 0.18, PAR, { color: CAM_BRICK });

  // Hanging pub sign on a bracket, between the first-floor windows.
  {
    const g = new THREE.Group();
    child(g, mesh(rbox(0.05, 0.05, 0.75, 0.01), M.iron), 0, 0.3, 0.37);
    const strut = child(g, mesh(rbox(0.04, 0.04, 0.6, 0.01), M.iron), 0, 0.05, 0.25);
    strut.rotation.x = -0.7;
    child(g, mesh(rbox(0.04, 0.62, 0.42, 0.02), M.camGreen), 0, -0.06, 0.62);
    const face1 = child(g, canvasPlane(0.36, 0.56, (gc, Wc, Hc) => {
      gc.fillStyle = '#23443a'; gc.fillRect(0, 0, Wc, Hc);
      gc.strokeStyle = '#d4ad60'; gc.lineWidth = Wc * 0.04; gc.strokeRect(Wc * 0.08, Hc * 0.06, Wc * 0.84, Hc * 0.88);
      gc.fillStyle = '#d4ad60'; gc.textAlign = 'center'; gc.textBaseline = 'middle';
      gc.font = `600 ${Math.round(Wc * 0.2)}px "Cormorant Garamond", Georgia, serif`;
      gc.fillText('C A', Wc / 2, Hc * 0.5);
    }, { glow: 0.3 }), 0.025, -0.06, 0.62);
    face1.rotation.y = Math.PI / 2;
    onFace(f, g, 5.25, 6.3, 0.05);
  }

  // ── Ends and back: a blank party wall to the east (the terrace runs on from it), plain on the alley ──
  layBricks(fE, 0, PAR, { color: CAM_BRICK });
  faceBox(fW, 6.5, PAR, 0.04, mat('#8a5a46', { roughness: 0.95 }), 3.25, PAR / 2, 0.0, 0.01);
  faceBox(fW, 6.5, 0.35, 0.05, M.plinth, 3.25, 0.18, 0.01, 0.01);
  faceBox(fW, 0.9, 2.0, 0.06, M.camDoor, 4.8, 1.0, 0.03, 0.02);
  faceBox(fB, W, PAR, 0.04, mat('#8a5a46', { roughness: 0.95 }), W / 2, PAR / 2, 0.0, 0.01);
  for (const s of [1.8, 4.0, 6.2]) faceBox(fB, 0.85, 1.3, 0.04, rng(s)() > 0.5 ? M.windowGlass : M.windowDark, s, 7.9, 0.03, 0.01);
  chimney(X0 + 1.2, ZB - 0.8, TOP, { color: CAM_BRICK[0], pots: 3 });
  chimney(X1 - 1.2, ZB - 0.8, TOP, { color: CAM_BRICK[0], pots: 2 });

  // ── Inside: bar back, pendants, warm light ──
  add(mesh(rbox(5.5, 1.05, 0.45, 0.04), M.darkWood), X0 + 4.0, 0.53, ZF + 1.4);
  add(mesh(rbox(5.6, 0.05, 0.55, 0.02), M.brass), X0 + 4.0, 1.07, ZF + 1.4);
  for (const x of [X0 + 2.2, X0 + 4.0, X0 + 5.8]) {
    add(mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.5, 4), M.brass, false), x, FASC - 0.3, ZF + 0.8);
    add(mesh(new THREE.ConeGeometry(0.2, 0.2, 14, 1, true), M.pendant, false), x, FASC - 0.65, ZF + 0.8);
    const l = new THREE.PointLight('#ffb35e', 0, 5, 1.4);
    l.position.set(x, 2.2, ZF + 0.9); world.add(l);
    nightLights.push({ light: l, max: 5 });
  }
  // The alley between the pub and the station is the station plot's own paving.
  litterBin(X0 - 0.8, ZF + 0.8, Math.PI);
  currentPlace = null;
  return { poly: foot, x0: X0, x1: X1, top: PAR + 0.14, brick: CAM_BRICK[0] };
}

// ── Half Cut Market ──────────────────────────────────────────────────────────
// Three doors east of the Camberwell Arms, in a three-storey yellow stock-brick terrace.
// From refs/half-cut/: a black-framed shopfront under a royal-blue fascia with the white
// "1 / CUT / 2" logo, a matching blue awning pulled out with a small logo on its valance,
// a black roller shutter at the left end and a chalkboard panel at the right. Through the
// glass: gold HALF CUT letters on a putty wall between two globe lights, a pink-tiled
// counter with a plant on it, the pink WE GOT BEER neon in the right-hand window, and
// white shelves of bottles behind a teal pilaster. Folding slatted tables and chairs on
// the cobbles outside. Upstairs: two tall six-over-six sashes with white architraves and
// cornice hoods, plainer sashes above, and a black downpipe between them.
const HC_BRICK = ['#c9ab70', '#bd9d63', '#d2b67e', '#b39158', '#c4a46c', '#a88a56', '#cdb388', '#9c8255'];
Object.assign(M, {
  hcBlue: mat('#2253b3', { roughness: 0.42, clearcoat: 0.2, clearcoatRoughness: 0.4 }),
  hcBlueDeep: mat('#1b4494', { roughness: 0.45 }),
  hcAwning: addMotion(mat('#1f4cab', { roughness: 0.62, side: THREE.DoubleSide }), 'hcAwning', { world: `wOff.y += sin(uTime * 1.8 + ip.x * 1.3 + ip.z * 0.9) * 0.012 * gust;` }),
  hcBlack: mat('#1c1f23', { roughness: 0.4, clearcoat: 0.2, clearcoatRoughness: 0.4 }),
  hcTeal: mat('#1d5a5a', { roughness: 0.4, clearcoat: 0.25, clearcoatRoughness: 0.4 }),
  hcMortar: mat('#b5a27c', { roughness: 0.95 }),
  hcInterior: mat('#dccbb5', { roughness: 0.85, emissive: '#ffbf7a', emissiveIntensity: 0 }),
  hcPink: mat('#eab9b2', { roughness: 0.35 }),
  hcShelf: mat('#f3f0ea', { roughness: 0.6 }),
  hcSlat: mat('#c99a62', { roughness: 0.6 }),
  hcSett: mat('#ffffff', { roughness: 0.85 }),
  hcGlobe: mat('#fff4e2', { roughness: 0.3, emissive: '#ffe2b0', emissiveIntensity: 0.2 }),
  hcShutter: mat('#2e3136', { roughness: 0.5, metalness: 0.4 }),
});
const BOTTLE_MATS = {
  green: mat('#2e4a2c', { roughness: 0.18 }), amber: mat('#6b3a17', { roughness: 0.18 }),
  clear: mat('#d3d9cf', { roughness: 0.15 }), rose: mat('#e3a3a0', { roughness: 0.18 }), red: mat('#4a1620', { roughness: 0.18 }),
};
const BOTTLE_KINDS = Object.keys(BOTTLE_MATS);
// Bottles standing on a shelf: [x, y, z, kind] each, merged by colour.
function bottles(list) {
  const byKind = new Map();
  for (const [x, y, z, kind] of list) {
    if (!byKind.has(kind)) byKind.set(kind, []);
    byKind.get(kind).push(
      new THREE.CylinderGeometry(0.034, 0.036, 0.2, 8).translate(x, y + 0.1, z),
      new THREE.CylinderGeometry(0.012, 0.017, 0.09, 6).translate(x, y + 0.245, z));
  }
  for (const [kind, geos] of byKind) world.add(mesh(mergeGeometries(geos), BOTTLE_MATS[kind], false));
}
// The Half Cut logo: a rounded white outline, a big "1", a white bar reading CUT, a big "2".
function halfCutLogo(g, x, y, w, h, { fg = '#ffffff', bg = '#2253b3' } = {}) {
  const lw = w * 0.07;
  g.save();
  g.strokeStyle = fg; g.lineWidth = lw; g.lineJoin = 'round';
  roundRectPath(g, x + lw / 2, y + lw / 2, w - lw, h - lw, w * 0.1);
  g.stroke();
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  const big = `${Math.round(h * 0.4)}px "Archivo Black", "Arial Black", sans-serif`;
  g.font = big; g.fillText('1', x + w * 0.5, y + h * 0.42);
  roundRectPath(g, x + w * 0.2, y + h * 0.455, w * 0.6, h * 0.12, h * 0.015); g.fill();
  g.fillStyle = bg; g.textBaseline = 'middle';

  const SH = [0, 0.68], LW = [0.68, 2.36], DR = [2.36, 3.44], RW = [3.44, 4.6], PL = [4.6, 4.9], BS = [4.9, 5.42], CB = [5.42, W];

  // Roller shutter, pulled down.

// Build part of the street, then slide everything it added along x: meshes and lights in

  const v = new THREE.Vector3();

  const cols = ['#3a4720', '#4a5a2a', '#55692f', '#6b7a35', '#8a7a2e', '#9a5a26'].map(c => new THREE.Color(c));
  for (let i = 0; i < Math.round(len * 120 * Q.leafDensity); i++) {

      color: cols[Math.min(cols.length - 1, Math.floor(Math.pow(r(), 1.8) * cols.length))] });

}

// Festoon lights: a sagging wire from (a) to (b) with warm bulbs along it.
function festoon(a, b, sag, bulbs) {
  const wire = [], lamps = [];
  const pts = [];
  for (let i = 0; i <= 20; i++) {
    const t = i / 20;
    pts.push(new THREE.Vector3().lerpVectors(a, b, t).add(new THREE.Vector3(0, -sag * 4 * t * (1 - t), 0)));
  }
  for (let i = 0; i < 20; i++) {
    const p = pts[i], q = pts[i + 1], len = p.distanceTo(q);
    const geo = new THREE.CylinderGeometry(0.008, 0.008, len, 4);
    geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), q.clone().sub(p).normalize()));
    geo.translate((p.x + q.x) / 2, (p.y + q.y) / 2, (p.z + q.z) / 2);
    wire.push(geo);
  }
  for (let i = 1; i < bulbs; i++) {
    const t = i / bulbs, p = new THREE.Vector3().lerpVectors(a, b, t).add(new THREE.Vector3(0, -sag * 4 * t * (1 - t) - 0.08, 0));
    lamps.push(new THREE.SphereGeometry(0.05, 8, 6).translate(p.x, p.y, p.z));
  }
  world.add(mesh(mergeGeometries(wire), M.iron, false));
  world.add(mesh(mergeGeometries(lamps), M.festoon, false));
}

    outer.push([cx + Math.cos(a) * r1, cz + Math.sin(a) * r1]);
    inner.push([cx + Math.cos(a) * r0, cz + Math.sin(a) * r0]);

  return [...outer, ...inner.reverse()];
}

}
// Keep only the Q.liveLights point lights nearest the camera target switched on. A forward
// renderer charges every lit surface for every visible light, so this is the single biggest
// win on a phone, and from any one viewpoint only a handful of lamps are in range anyway.
function cullLights(force = false) {
  const t = controls.target;
  const key = `${Math.round(t.x / 3)}|${Math.round(t.z / 3)}|${night > 0.5}`;
  if (!force && key === lastCullKey) return;
  lastCullKey = key;
  if (night < 0.02) { nightLights.forEach(e => (e.light.visible = false)); return; }   // all off by day
  const sorted = nightLights.map(e => ({ e, d: e.light.position.distanceTo(t) })).sort((a, b) => a.d - b.d);
  sorted.forEach(({ e }, i) => { e.light.visible = i < Q.liveLights; });
}
// On a fixed cadence the loop renders every Nth vsync exactly (counting frames, not timing
// them: a timestamp gate can render twice in a row when a frame arrives a hair early, which
// is itself a visible tick).
let frameTick = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!refreshHz) {
    hzSamples.push(now);
    if (hzSamples.length >= 61) {
      const gaps = hzSamples.slice(1).map((t, i) => t - hzSamples[i]).sort((a, b) => a - b);
      refreshHz = Math.round(1000 / gaps[gaps.length >> 1] / 10) * 10 || 60;   // 60, 90, 120
    }
  }
  if (RENDER_HZ && (frameTick++ % Math.max(1, Math.round((refreshHz || 60) / RENDER_HZ)))) return;
  const dt = Math.min(0.05, (now - (lastFrame || now)) / 1000);
  lastFrame = now;
  if (opts.motion && document.visibilityState === 'visible') {
    uTime.value = now / 1000;
    stepSmoke(uTime.value);
    stepDrifters(dt, uTime.value);
    stepFloaters(dt, uTime.value);
    if (M.water.bumpMap) M.water.bumpMap.offset.set(uTime.value * 0.006, uTime.value * 0.004);
    dirty = true;
  }
  cullLights();
  const a = stepAnim(now);
  const m = stepMode(now);
  const w = stepStroll();
  const sp = stepSpin();
  const b = stepBuild();
  const c = anim || sp ? false : controls.update();
  const ambientOnly = opts.motion && !(a || m || w || c || sp || b || needsFull);   // false whenever the camera moved
  needsFull = false;
  if ((a || m || w || c || sp || b || dirty) && !(ambientOnly && now - lastRendered < 30)) {
    if (bokeh) bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target);
    if (composer) composer.render(); else renderer.render(scene, camera);
    lastFrameInfo = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
    renderCount++;
    renderer.autoClear = false;
    renderer.render(fxScene, camera);
    renderer.autoClear = true;
    dirty = false;

}
// Startup runs last, after every declaration above, so nothing it calls can reach an
// uninitialised binding (that bit us with FLOAT_HIDE, lastCullKey and frameGaps).
applyLighting(state.mode === 'night' ? 1 : 0);

// ── Build-in intro (?build=1, recording only) ──────────────────────────────────
// Every material in the scene gets a shader patch: a part whose turn hasn't come is squashed
// flat to just under the ground (so it rises out of it), and fragments beyond the wave are
// discarded (so the ground spreads outwards rather than appearing all at once). With build
// off nothing is patched. Shadows are faded in over the same time, since the shadow map is
// drawn from the unpatched depth material and would otherwise show the whole street's
// shadows on the first frame.
// Timing: uBuild runs 0 → 1 over buildms. A part whose centre is d metres past the start
// place's radius (uBuildR.x) begins to rise at uBuild = d / uBuildR.y × (1 − uBuildR.z) and
// takes uBuildR.z of the whole to rise, with a cubic ease-out, so the street builds outwards
// in a wave and each part lifts gently rather than popping. buildr=12 sets that radius in
// metres (the parts inside it make up the first frame); buildms=2600 the length.
const uBuild = { value: opts.build ? 0 : 1 };
const uBuildC = { value: PLACES[state.place].c.clone() };
const uBuildR = { value: new THREE.Vector3(+params.get('buildr') || 12, 110, 0.35) };   // first-frame radius, the farthest part, the rise as a share of the whole
let build = opts.build ? { t0: null, auto: opts.build === 'auto', delay: 700, dur: +params.get('buildms') || 2600 } : null;
if (opts.build) {
  const BUILD_Y = -1.2;   // everything rises from just under the island slabs
  scene.updateMatrixWorld(true);
  const patched = new Set(), seenGeo = new Set(), tmpM = new THREE.Matrix4(), tmpV = new THREE.Vector3();
  scene.traverse(o => {
    if (!o.isMesh || !o.material) return;
    if (o.isInstancedMesh) {
      // Instances rise about their own position; bricks about their venue's centre, so a
      // brick wall lifts with its building rather than course by course.
      const n = o.count, centre = new Float32Array(n * 2), flatA = new Float32Array(n);
      const gb = (o.geometry.boundingBox || o.geometry.computeBoundingBox() || o.geometry.boundingBox);
      const low = gb.max.y - gb.min.y < 0.15;
      for (let i = 0; i < n; i++) {
        o.getMatrixAt(i, tmpM); tmpV.setFromMatrixPosition(tmpM).applyMatrix4(o.matrixWorld);
        const venue = o === brickMesh && bricks[i] && PLACES[bricks[i].place];
        centre[i * 2] = venue ? venue.c.x : tmpV.x; centre[i * 2 + 1] = venue ? venue.c.z : tmpV.z;
        flatA[i] = !venue && low && tmpV.y < 0.2 ? 1 : 0;
      }
      o.geometry.setAttribute('aCentre', new THREE.InstancedBufferAttribute(centre, 2));
      o.geometry.setAttribute('aFlat', new THREE.InstancedBufferAttribute(flatA, 1));
    } else if (!o.geometry.attributes.aCentre) {
      if (seenGeo.has(o.geometry)) o.geometry = o.geometry.clone();   // shared between parts in different places
      seenGeo.add(o.geometry);
      buildTagGeometry(o.geometry, new THREE.Box3().setFromObject(o));
    }
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(patchBuild);
  });
  function patchBuild(m) {
    if (patched.has(m)) return;
    patched.add(m);
    const prev = m.onBeforeCompile, prevKey = m.customProgramCacheKey !== THREE.Material.prototype.customProgramCacheKey ? m.customProgramCacheKey : null;
    m.onBeforeCompile = sh => {
      prev.call(m, sh);
      if (!sh.vertexShader.includes('#include <begin_vertex>')) return;   // sprites, points: left alone
      sh.uniforms.uBuild = uBuild; sh.uniforms.uBuildC = uBuildC; sh.uniforms.uBuildR = uBuildR;
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nuniform float uBuild; uniform vec3 uBuildC; uniform vec3 uBuildR; attribute vec2 aCentre; attribute float aFlat; varying vec2 vBuildXZ;')
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          #ifdef USE_INSTANCING
            mat4 bM = modelMatrix * instanceMatrix;
          #else
            mat4 bM = modelMatrix;
          #endif
          vec4 bw = bM * vec4(transformed, 1.0);
          vBuildXZ = bw.xz;
          float bd = max(0.0, distance(mix(aCentre, bw.xz, aFlat), uBuildC.xz) - uBuildR.x);
          float bt = bd <= 0.0 ? 1.0 : clamp((uBuild - clamp(bd / uBuildR.y, 0.0, 1.0) * (1.0 - uBuildR.z)) / uBuildR.z, 0.0, 1.0);
          bt = 1.0 - pow(1.0 - bt, 3.0);
          if (bt < 1.0) {
            bw.y = ${BUILD_Y.toFixed(2)} + (bw.y - ${BUILD_Y.toFixed(2)}) * max(bt, 0.002);
            transformed = (inverse(bM) * bw).xyz;
          }`);
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform float uBuild; uniform vec3 uBuildC; uniform vec3 uBuildR; varying vec2 vBuildXZ;')
        .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
          float fd = max(0.0, distance(vBuildXZ, uBuildC.xz) - uBuildR.x - 6.0);   // 6 m past the radius: a part on the edge keeps its far side

    };
    m.customProgramCacheKey = () => (prevKey ? prevKey.call(m) : prev.toString()) + '|build';

}
// Read from performance.now() rather than the frame timestamp, so a recording harness that
// steps the clock itself drives it.
function stepBuild() {

  if (build.t0 === null) {

    build.t0 = performance.now() + build.delay; return false;   // the first frame has been drawn: hold, then go
  }

renderer.compile(scene, camera);
watchFrom = performance.now() + 6000;
document.getElementById('title').textContent = PLACES[state.place].title;
document.getElementById('subtitle').textContent = PLACES[state.place].sub;
controls.target.copy(PLACES[state.place].c);
camera.position.set(0, 40, 60);
goTo(true);
setSpin(state.spin);
syncUI();
requestAnimationFrame(frame);

drawSigns();
Promise.race([
  Promise.all([
    document.fonts.load('48px "UnifrakturMaguntia"'),
    document.fonts.load('italic 500 48px "Newsreader"'),
    document.fonts.load('600 48px "Cormorant Garamond"'),
    document.fonts.load('48px "Pinyon Script"'),
    document.fonts.load('48px "Caveat Brush"'),
    document.fonts.load('500 48px "Barlow Semi Condensed"'),
    document.fonts.load('48px "Archivo Black"'),
    document.fonts.load('48px "Marcellus SC"'),
  ]),
  new Promise(r => setTimeout(r, 2500)),
]).then(drawSigns).catch(() => {});

const afterFirstFrame = fn => requestAnimationFrame(() => opts.build ? requestAnimationFrame(fn) : fn());
afterFirstFrame(() => {
  document.getElementById('loading').classList.add('done');
  // 'ready' carries the list of places (in the order of the page's own buttons) so a host app
  // can offer them in its own picker without keeping a copy.
  emit('ready', { places: [...document.querySelectorAll('[data-place]')].filter(b => b.dataset.place !== 'all').map(b => ({ id: b.dataset.place, name: PLACES[b.dataset.place].title, short: b.textContent })) });
});
